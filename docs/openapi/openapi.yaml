        **范围**：每次请求只采样一次 `as_of`，扫描 `bucket_start >= retention_cutoff AND bucket_start < as_of`（`retention_cutoff` 算法见 `UsageRangeBase`），不依赖物理清理。两个维度独立去重（按原文逐字节相等，不做大小写或别名合并），按字节序升序排列，不截断；无数据时为 `[]`，不是错误。

        **授权**：先会话，再 workspace 成员角色（owner 与 member 可读），然后才查询；跨空间返回 `403`，不泄露其数据。
