        请求体必须为空。写操作必须携带可信 `Origin`，准入顺序与签发相同（`Origin` → 会话 → owner → 请求体 → `credentialID` 解析 → 数据库），任一失败都不创建凭证。与签发一样，轮换不是幂等操作，并发轮换会各自创建独立有效凭证，这是明确行为，不做隐形去重。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
