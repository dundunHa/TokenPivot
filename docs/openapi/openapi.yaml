  /api/v1/workspaces/{workspaceID}/usage/events:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags:
        - usage
      operationId: getUsageEvents
      summary: 分页查询请求明细（T-058）
      description: |
        从原始 `usage_events` 按 `occurred_at DESC, id DESC` 返回请求级明细，keyset 分页，不用 OFFSET，不返回总数。Provider/Model/Project 筛选规则与 `usage/rate` 完全相同，同维 OR、异维 AND。

        **范围**：`[start,end)` 过滤 `occurred_at`，`start`/`end` 必须同时出现或同时省略，带偏移、最多 6 位小数秒的 RFC 3339，不要求分钟对齐，`start<end`。无 cursor 且省略时，服务端取 `end=as_of`、`start=end-1h`；有 cursor 且省略时沿用 cursor 内的首页范围，不重新计算；有 cursor 且显式提供时按时间点比较，不相等返回 `400`。响应总是返回实际 `start/end/as_of`。

        **分页**：`limit` 默认 50、最大 100（接口安全上限，不是性能承诺）。`cursor` 是不透明 base64url 文本，不是授权凭据，每页仍重做会话、成员与筛选校验；改变筛选必须丢弃 cursor。**不是跨请求快照**：翻页期间首页之后到达且发生时间落在已翻过位置的补报，要从最新页重新查询才可见。

        **字段质量**：`input_tokens`/`output_tokens`/`total_tokens` 各自 `{value,quality}`；`quality=missing` 时 `value=null`（不可用），known/estimated 的 `0` 是真实数值。`status`、`duration_ms` 为 `null` 表示来源未提供，不是 0。`project=null` 表示未归属。`retention_cutoff=as_of-180天`，仅提示按 `received_at` 的保留截点，空结果只表示保留明细中没有匹配事件。

        **授权**：先会话，再 workspace 成员角色（owner 与 member 可读），再校验参数；Project UUID 不属于路径 workspace 一律 `400 INVALID_ARGUMENT`，不透露它属于哪个空间。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestStart'
        - $ref: '#/components/parameters/RequestEnd'
        - $ref: '#/components/parameters/RequestLimit'
        - $ref: '#/components/parameters/RequestCursor'
        - $ref: '#/components/parameters/RequestProvider'
        - $ref: '#/components/parameters/RequestModel'
        - $ref: '#/components/parameters/RequestProject'
      responses:
        '200':
          description: '一页明细，最新在前。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDetailsResponse'
              example:
                items:
                  - id: 0199a0b0-0000-7000-8000-000000000101
                    occurred_at: '2026-10-28T11:59:58.123456Z'
                    received_at: '2026-10-28T12:00:00.5Z'
                    provider: example-provider
                    model: example-model
                    project: {id: 0199a0b0-0000-7000-8000-00000000000a, key: demo, name: Demo}
                    source: {id: 0199a0b0-0000-7000-8000-000000000010, platform: example, instance_key: laptop}
                    input_tokens: {value: 100, quality: known}
                    output_tokens: {value: null, quality: missing}
                    total_tokens: {value: 120, quality: estimated}
                    status: null
                    duration_ms: 0
                next_cursor: null
                has_more: false
                start: '2026-10-28T11:00:00Z'
                end: '2026-10-28T12:00:00Z'
                as_of: '2026-10-28T12:00:00Z'
                retention_cutoff: '2026-05-01T12:00:00Z'
        '400':
          description: '`INVALID_ARGUMENT`：路径 UUID、参数、范围、cursor 非法，或 Project UUID 不属于该 workspace。不执行明细 SQL。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: request is not acceptable
        '401':
          description: '`UNAUTHENTICATED`：无有效浏览器会话。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：不是该 workspace 成员。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace membership required
        '500':
          description: '`INTERNAL`：成员角色或查询数据库故障；不含 SQL 细节。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INTERNAL
                  message: internal error
        '503':
          description: '`UNAVAILABLE`：会话续期等认证依赖不可用，请求在查询前停止。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAVAILABLE
                  message: service is unavailable
  /api/v1/workspaces/{workspaceID}/usage/rate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags:
        - usage
      operationId: getUsageRate
      summary: 查询精确 60 秒总 Token 速率（T-058）
      description: |
        读取原始 `usage_events`，按 `occurred_at` 在精确滚动窗口 `[as_of-60s,as_of)` 内对 `total_tokens` 求和；窗口恰为 60 秒，所以该和就是 tokens/min，不外推、不按自然分钟拼接。`as_of` 是数据库单条语句的开始时间，客户端不能指定。只接受 `provider`/`model`/`project` 筛选，其他参数（含 `start`/`end`/`limit`）返回 `400`。

        **口径**：`total_tokens.value` 是 known+estimated 的精确和（十进制字符串，可能超过 2^53-1）；`event_count=0` 与「有事件但全为 missing」都得 `value=null`，不是 0，调用方需分别展示。`estimated_count>0` 表示含估算，`missing_count>0` 表示部分覆盖。`window_last_received_at` 只取窗口内、符合筛选的事件的 `max(received_at)`，无事件为 `null`；它不表示数据源在线状态。早于窗口的历史补报即使刚到达也不计入。

        **授权**与筛选规则同 `usage/events`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestProvider'
        - $ref: '#/components/parameters/RequestModel'
        - $ref: '#/components/parameters/RequestProject'
      responses:
        '200':
          description: '当前 60 秒窗口速率。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUsageRateResponse'
              example:
                start: '2026-10-28T11:59:00Z'
                end: '2026-10-28T12:00:00Z'
                as_of: '2026-10-28T12:00:00Z'
                window_seconds: 60
                unit: tokens/min
                total_tokens: {value: '12000', event_count: 5, known_count: 3, estimated_count: 1, missing_count: 1}
                window_last_received_at: '2026-10-28T11:59:59.9Z'
        '400':
          description: '`INVALID_ARGUMENT`：路径 UUID、参数非法，或 Project UUID 不属于该 workspace。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: request is not acceptable
        '401':
          description: '`UNAUTHENTICATED`：无有效浏览器会话。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：不是该 workspace 成员。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace membership required
        '500':
          description: '`INTERNAL`：成员角色或查询数据库故障；不含 SQL 细节。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INTERNAL
                  message: internal error
        '503':
          description: '`UNAVAILABLE`：会话续期等认证依赖不可用，请求在查询前停止。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAVAILABLE
                  message: service is unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: tpk_<随机串>
      description: |
        插件接入凭证。令牌形如 `tpk_` + 随机串，由 T-010 签发；随机部分长度由签发方决定，客户端与本文都不硬编码它。

        认证成功即固定 `workspace_id` 与 `source_id`，身份只从认证取得，请求载荷中不得出现它们。令牌只以**摘要**形式存储，算法为对完整令牌计算 SHA-256、存 32 字节摘要（与 T-010 计划 `docs/plans/2026-10-27-ingestion-credentials.md` 第 63 行的 `secret_hash` 一致；本文只引用该算法，不重新定义令牌格式）。明文只在签发/轮换响应中出现一次；签发、轮换、撤销路径见 `credentials` 标签下的四个端点，插件令牌不能用于它们。

        请求只接受 `Authorization: Bearer <token>`；不回退 Cookie；没有该头、格式错误、已撤销统一返回 `401 UNAUTHENTICATED`，不泄露具体原因。

    cookieAuth:
      type: apiKey
      in: cookie
      name: tokenpivot_session
      description: |
        浏览器会话 Cookie。明文令牌为 `tps_` + `crypto/rand.Text()`（随机部分长度由 Go 标准库决定，本文不硬编码它）；数据库只保存完整令牌的 SHA-256 原始 32 字节摘要，不保存明文、十六进制文本或额外 pepper。插件令牌 `tpk_` 与本 Cookie 互不接受。

        Cookie 属性固定为：名称 `tokenpivot_session`、`Path=/`、**不设置 `Domain`**（因此是主机范围）、`HttpOnly`、`SameSite=Lax`。可信 Web origin 为 `https` 时 `Secure=true`；只有明确配置的回环开发 origin（`localhost`、`127.0.0.1`、`::1`）允许使用 `http`，此时 `Secure=false`；生产非回环 http origin 在启动时就被拒绝，不存在第二套 Cookie 配置。

        签发和实际续期时写 `Expires=<数据库返回的 expires_at>`，`Max-Age` 固定为 2592000 秒（30 天）——因为每个签发或续期后的 `expires_at` 都由数据库取 `now() + interval '30 days'`，两者表达同一期限。会话为 30 天精确滑动过期，无绝对上限；过期行暂不清理，但不会通过认证。

        Cookie 只用于浏览器端点。采集端点和 owner 凭证管理路由都**不得**因此把插件请求改成浏览器身份；凭证管理的 owner 判断要求该用户是路径 workspace 的成员且角色为 `owner`，非成员与 `member` 一律 `403 PERMISSION_DENIED`。

  parameters:
    TrustedOrigin:
      name: Origin
      in: header
      required: true
      description: |
        浏览器写请求的可信来源。必须恰好一个值，且与部署配置的可信 Web origin 在 scheme、host、port 上完全相等（host 与 scheme 比较不区分大小写，协议默认端口省略）。缺失、空白、`null`、多值列表或任何不等都返回 `403 PERMISSION_DENIED`，且不执行会话校验或数据库写入。服务端不从请求 `Host`、`Forwarded` 或 `X-Forwarded-Host` 建立信任。
      schema:
        type: string
        pattern: '^https?://[^/?#@]+$'
    WorkspaceID:
      name: workspaceID
      in: path
      required: true
      description: 'workspace 的 UUID。owner 判断与归属校验都使用它；客户端不能借请求体改用别的 workspace。'
      schema:
        type: string
        format: uuid
    SourceID:
      name: sourceID
      in: path
      required: true
      description: '采集 source 的 UUID。必须属于路径 `workspaceID`，否则返回 `404 NOT_FOUND`。'
      schema:
        type: string
        format: uuid
    ProjectID:
      name: projectID
      in: path
      required: true
      description: '项目的 UUID。必须属于路径 `workspaceID`，否则返回 `404 NOT_FOUND`。'
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialID
      in: path
      required: true
      description: '凭证的 UUID。必须属于路径 `workspaceID`，否则返回 `404 NOT_FOUND`，不泄露其是否存在。'
      schema:
        type: string
        format: uuid

    UsageStart:
      name: start
      in: query
      required: true
      description: '范围起点（含）。带偏移且分钟对齐（秒、小数秒均为 0）的 RFC 3339 时刻，转为 UTC instant。早于当次保留截点返回 `400 OUTSIDE_RETENTION`。'
      schema:
        type: string
        format: date-time
    UsageEnd:
      name: end
      in: query
      required: false
      description: '范围终点（不含）。带偏移且分钟对齐的 RFC 3339 时刻，不得晚于服务端当前时刻。省略表示本次请求采样一次的 `as_of`（包含当前未完成分钟）。'
      schema:
        type: string
        format: date-time
    UsageTimezone:
      name: timezone
      in: query
      required: true
      description: 'IANA 时区名称（如 `UTC`、`America/Los_Angeles`、`Australia/Lord_Howe`），只决定小时/天桶；空串、`Local` 与固定偏移被拒绝。'
      schema:
        type: string
        minLength: 1
    UsageGranularity:
      name: granularity
      in: query
      required: true
      schema:
        type: string
        enum: [minute, hour, day]
    UsageProvider:
      name: provider
      in: query
      required: false
      description: '精确、区分大小写的 provider；可重复，同维 OR；去重后最多 50 个，空值拒绝。'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    UsageModel:
      name: model
      in: query
      required: false
      description: '精确、区分大小写的 model；可重复，同维 OR；去重后最多 50 个，空值拒绝。'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          minLength: 1
    UsageProject:
      name: project
      in: query
      required: false
      description: '项目 UUID 或字面量 `unassigned`（未归属）；可重复，同维 OR，可组合；UUID 按身份去重（大小写不同视为同一项目），`unassigned` 计一个，去重后最多 50 个。其他 workspace 的项目 UUID 只得到本 workspace 内的空结果。'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(unassigned|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    RequestStart:
      name: start
      in: query
      required: false
      description: '明细范围起点（含），带偏移、最多 6 位小数秒的 RFC 3339；必须与 `end` 同时出现。'
      schema: {type: string, format: date-time}
    RequestEnd:
      name: end
      in: query
      required: false
      description: '明细范围终点（不含），规则同 `start`，且晚于 `start`。'
      schema: {type: string, format: date-time}
    RequestLimit:
      name: limit
      in: query
      required: false
      description: '每页行数，默认 50，最大 100；不接受前导零或重复。'
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    RequestCursor:
      name: cursor
      in: query
      required: false
      description: '上一页返回的不透明 `next_cursor`；不是授权凭据。'
      schema: {type: string, minLength: 1}
    RequestProvider:
      name: provider
      in: query
      required: false
      description: '精确、区分大小写的 provider；可重复，同维 OR，空值拒绝。'
      style: form
      explode: true
      schema: {type: array, items: {type: string, minLength: 1}}
    RequestModel:
      name: model
      in: query
      required: false
      description: '精确、区分大小写的 model；可重复，同维 OR，空值拒绝。'
      style: form
      explode: true
      schema: {type: array, items: {type: string, minLength: 1}}
    RequestProject:
      name: project
      in: query
      required: false
      description: '项目 UUID 或字面量 `unattributed`（`project_id IS NULL`）；可重复，同维 OR。注意不是 T-055 的 `unassigned`。UUID 不属于路径 workspace 返回 `400`。'
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          pattern: '^(unattributed|[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})$'
    UsageGroupBy:
      name: group_by
      in: query
      required: true
      schema:
        type: string
        enum: [project, provider, model]
    UsageLimit:
      name: limit
      in: query
      required: false
      description: '每页组数，默认 10，最大 50；首页与后续页必须相同。'
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    UsageCursor:
      name: cursor
      in: query
      required: false
      description: '上一响应的 `next_cursor`（不透明 base64url）。须同时重复原筛选、`group_by`、`limit` 与时间参数。'
      schema:
        type: string
        minLength: 1

  headers:
    NoStore:
      description: '固定为 `no-store`。认证端点与凭证管理端点的所有成功与失败响应都带此头，缓存响应不能替代新的会话认证、撤销检查或续期。'
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: '距当前固定窗口结束的秒数，向上取整且不小于 1。'
      schema:
        type: integer
        minimum: 1

  responses:
    AuthInvalidArgument:
      description: '`INVALID_ARGUMENT`：请求体不是单个 JSON 对象、含未知字段/重复键/尾随内容/非法 UTF-8，或邮箱、密码不符合格式规则。消息不回显被拒绝的值。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: INVALID_ARGUMENT
              message: request is not acceptable
    AuthPermissionDenied:
      description: '`PERMISSION_DENIED`：写请求的 `Origin` 缺失、为 `null`、多值或与可信 origin 不相等。不产生任何写入。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: PERMISSION_DENIED
              message: request origin is not allowed
    AuthBodyTooLarge:
      description: '`BODY_TOO_LARGE`：请求体超过 16 KiB。整次请求被拒绝，不执行密码哈希或数据库写入。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: BODY_TOO_LARGE
              message: request body is too large
    AuthUnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`：`Content-Type` 不是 `application/json`（可带参数，如 charset）。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: content type must be application/json
    AuthRateLimited:
      description: '`RATE_LIMITED`：邮箱或远端 IP 的固定窗口已用尽。响应带 `Retry-After`；达到上限的请求不执行哈希或写库。限流是单进程内存计数，多实例不共享。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: RATE_LIMITED
              message: too many attempts; retry later
    AuthInternal:
      description: '`INTERNAL`：非预期的服务端故障。响应不含数据库消息、密码、令牌或摘要。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: INTERNAL
              message: internal error
    CredentialUnavailable:
      description: '`UNAVAILABLE`：会话存储等依赖不可用，请求在读取或创建凭证之前就停止。不得据此判定请求未认证或凭证已撤销、已创建；按原请求重试。写操作的 `Origin` 先于会话校验，因此 `Origin` 不合法时仍得到 `403` 而不是本码。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CredentialError'
          example:
            error:
              code: UNAVAILABLE
              message: service is unavailable
    ManagementInvalidArgument:
      description: '`INVALID_ARGUMENT`：路径 UUID、JSON、字段或空请求体不符合要求（DELETE 带非空请求体也是此码）。消息固定，不回显请求值；不执行业务写入。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: INVALID_ARGUMENT
              message: request is not acceptable
    ManagementUnauthenticated:
      description: '`UNAUTHENTICATED`：无 Cookie，或会话无效、过期、已撤销。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: UNAUTHENTICATED
              message: authentication required
    ManagementPermissionDenied:
      description: '`PERMISSION_DENIED`：写请求 `Origin` 缺失、`null`、多值或不等于可信 origin；或会话用户不是该 workspace 成员（非成员），或 member 执行 owner 写操作。不区分未加入与角色不足。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: PERMISSION_DENIED
              message: workspace owner required
    ManagementNotFound:
      description: '`NOT_FOUND`：项目或来源不存在，或属于另一空间。角色检查通过后才可能出现，不返回真实归属。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: NOT_FOUND
              message: resource not found
    ManagementConflict:
      description: '`CONFLICT`：项目键或来源 `(platform, instance_key)` 与同空间已有行（含已归档行）冲突。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: CONFLICT
              message: resource already exists
    ManagementBodyTooLarge:
      description: '`BODY_TOO_LARGE`：请求体超过 16 KiB。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: BODY_TOO_LARGE
              message: request body is too large
    ManagementUnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`：`Content-Type` 不是 `application/json`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              message: content type must be application/json
    ManagementInternal:
      description: '`INTERNAL`：成员角色、项目、来源或凭证管理数据库故障。响应不含 SQL、约束细节或令牌；绝不降级为 `403`。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: INTERNAL
              message: internal error
    ManagementUnavailable:
      description: '`UNAVAILABLE`：仅对应会话存储或续期依赖故障，请求在读取或写入资源之前停止；不得据此判定未认证或已写入，按原请求重试。数据库角色/资源故障是 `500`，不是本码。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ManagementError'
          example:
            error:
              code: UNAVAILABLE
              message: service is unavailable
    AuthUnavailable:
      description: '`UNAVAILABLE`：数据库等依赖不可用。不得据此宣称会话已撤销或账号已创建；按原请求重试。'
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthError'
          example:
            error:
              code: UNAVAILABLE
              message: service is unavailable

  schemas:
    IngestionBatchRequest:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          description: |
            事件数组，保持输入顺序；响应结果按这里的下标对应。

            长度 1–100（含）。空数组整批拒绝（`400 INVALID_ARGUMENT`），超过 100 项同样整批拒绝——不是只处理前 100 项。同一批内允许出现相同的 `source_event_id`，此时按输入下标分别给出结果，不得合并。
          items:
            $ref: '#/components/schemas/UsageEvent'
      description: |
        请求外壳：顶层只有 `events`。`workspace_id`、`source_id`、凭证 ID、`received_at`、`format_version` 都不能出现在这里，出现即整批 `400 INVALID_ARGUMENT`。

        任何层级的重复 JSON 键、无法无歧义解析的 JSON 都是整批拒绝（这是实现检查，schema 表达不了）。

    UsageEvent:
      type: object
      additionalProperties: false
      required:
        - source_event_id
        - provider
        - model
        - occurred_at
        - usage
      properties:
        source_event_id:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^\u0000-\u001F\u007F\u0080-\u009F]+$'
          description: |
            来源侧稳定事件 ID，与认证得到的 workspace/source 共同构成事件身份 `(workspace_id, source_id, source_event_id)`。

            - 不透明，**逐字节比较**：不做大小写折叠、不做空白 trim、不做 Unicode 归一化。
            - 长度 1–256 个 **UTF-8 字节**（不是字符数）。`maxLength: 256` 只按字符挡住超限，字节校验由实现执行；100 个汉字（300 字节）是非法值。
            - 拒绝 NUL 与控制字符（U+0000–U+001F、U+007F、U+0080–U+009F），见 `pattern`。
            - 同一稳定 source 内不得复用该 ID。
            - 不参与规范化比较：身份已由唯一键确定，重传改变它就不是同一个事件。

            校验方式：schema（类型、字符长度、字符集）+ 实现（UTF-8 字节长度）。
        project_id:
          type:
            - string
            - 'null'
          pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          description: |
            未归属项目即省略或写 `null`，两种表示等价，含义都是“未归属”。

            非空时必须是带连字符的 UUID，大小写均可；存储与比较统一为**小写**。非法、跨 workspace 或不可用的项目必须拒绝（`PROJECT_INVALID`），不能降级为 `null`——用未归属掩盖越权是错误的。项目的生成与注册规则属 T-044，本文不定义。

            参与规范化：第 1 个元素，写小写 UUID 或 `null`。

            校验方式：schema（UUID 形态）+ 实现（归属与可用性）。
        provider:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F\u0080-\u009F]+$'
          not:
            pattern: '^[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]|[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]$'
          description: |
            Provider 名称，必填。

            - 1–128 个 **UTF-8 字节**；空值、首尾空白、控制字符均拒绝。
            - 「首尾空白」按 Unicode `White_Space` 属性判定，**含** U+00A0（NBSP）与 U+3000（全角空格）。完整字符集：U+0009–U+000D、U+0020、U+0085、U+00A0、U+1680、U+2000–U+200A、U+2028、U+2029、U+202F、U+205F、U+3000（其中 U+0009–U+000D 与 U+0085 已先被控制字符规则拒绝）。
            - 上面 `not.pattern` 就是把这一集合按 ECMA-262 语法写死的形态：首字符或末字符命中集合即拒绝。不用 `\s`，因为 ECMA-262 的 `\s` 比 `White_Space` 多 U+FEFF、少 U+0085（后者已被控制字符规则拒绝）。**实现不能照搬**：Go 的 `regexp` 不支持 `\u` 转义，且 Go 的 `\s` 连 U+00A0 与 U+3000 都不匹配，必须改写为 `\x{...}` 显式列集合，见第 11 节。
            - 保留大小写，**不做**别名合并、trim 或 Unicode 归一化；`OpenAI` 与 `openai` 是两个不同内容。
            - 参与规范化：第 2 个元素，原样字节字符串。

            校验方式：schema（类型、字符长度、无控制字符、无首尾空白）+ 实现（UTF-8 字节长度、与该集合等价的 `White_Space` 字符集）。
        model:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[^\u0000-\u001F\u007F\u0080-\u009F]+$'
          not:
            pattern: '^[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]|[\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]$'
          description: |
            模型标识，必填。规则与 `provider` 相同：1–128 UTF-8 字节、拒绝空值与首尾空白与控制字符、保留大小写、不做别名合并或归一化。

            「首尾空白」同样按 Unicode `White_Space` 属性判定并**含** U+00A0 与 U+3000，完整字符集与 Go 实现注意事项见 `provider` 与本文件第 11 节。

            参与规范化：第 3 个元素，原样字节字符串。
        occurred_at:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}[Tt][0-9]{2}:[0-9]{2}:[0-5][0-9](?:\.[0-9]{1,6})?(?:[Zz]|[+-][0-9]{2}:[0-9]{2})$'
          description: |
            请求最终完成的时刻。不得用采集、上传或接收时间替代。

            - 必填 RFC 3339 时间字符串，**必须带偏移**（`Z` 或 `±HH:MM`）。小写 `t`/`z` 按 RFC 3339 接受。
            - 小数秒最多 6 位；超过 6 位拒绝（不舍入、不截断）。秒值 `60`（闰秒）被 `pattern` 拒绝。没有偏移的本地时间被 `pattern` 拒绝。
            - 解析后统一折算为 **UTC 微秒**。`2026-10-27T14:00:00Z` 与 `2026-10-27T07:00:00-07:00` 规范化后相同。
            - 日历上不存在的日期（如 2 月 30 日）与超出范围的偏移由实现拒绝（`INVALID_ARGUMENT`）。
            - 有效窗口 `[T - 180×24h, T]` 两端包含，时钟偏差 0 秒：下界之前 → `expired`；`T` 之后 → `rejected/FUTURE_EVENT`。完整规则、采样点与七组边界样例见 `info.description` 第 5 节。
            - 参与规范化：第 0 个元素，写 `YYYY-MM-DDTHH:MM:SS.ffffffZ`（固定 6 位小数秒、始终 `Z`）。

            校验方式：schema（`pattern` 的形态检查；`format` 在 3.1 里默认只是注解，不构成强制断言）+ 实现（解析、日历合法性、偏移范围、窗口判断）。
        usage:
          $ref: '#/components/schemas/UsageObject'
        status:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
          pattern: '^[^\u0000-\u001F\u007F\u0080-\u009F]+$'
          description: |
            请求状态，可省略或为 `null`（含义：来源不提供）。

            非空时为 1–64 个 UTF-8 字节的字符串。首版**不透明保存**：不发明平台状态映射，不做大小写或空白归一化。

            参与规范化：第 5 个元素，原样字节字符串或 `null`；省略等价于 `null`。

            校验方式：schema（类型、字符长度、无控制字符）+ 实现（UTF-8 字节长度）。
        duration_ms:
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 9007199254740991
          description: |
            请求耗时（毫秒），可省略或为 `null`（含义：未知）。非空时为 `[0, 2^53-1]` 的十进制整数；**`0` 是真实零，`null` 是未知**，两者不同。

            必须是 JSON number 的十进制整数形式：`1.0`、`1e3`、`"1000"`、`-0` 一律拒绝（这是实现按原始词法检查）。

            参与规范化：第 6 个元素，整数字面量或 `null`；省略等价于 `null`。

            校验方式：schema（类型与数值范围）+ 实现（数字词法）。
      description: |
        单个用量事件。必填 5 项：`source_event_id`、`provider`、`model`、`occurred_at`、`usage`；可选 3 项：`project_id`、`status`、`duration_ms`。

        | 字段 | 必填 | 类型与形式 | 范围 | 缺省/空值含义 | 参与规范化 |
        |---|---|---|---|---|---|
        | `source_event_id` | 是 | UTF-8 字符串，不透明，逐字节比较 | 1–256 字节，拒绝 NUL 与控制字符 | 无缺省 | 否（它是身份的一部分，不算内容） |
        | `project_id` | 否 | 带连字符 UUID 字符串 或 `null` | UUID 形态，大小写均可 | 省略与 `null` 同为“未归属” | 是（小写 UUID 或 `null`） |
        | `provider` | 是 | UTF-8 字符串 | 1–128 字节，拒绝空值/首尾空白/控制字符，保留大小写 | 无缺省 | 是（原样字节） |
        | `model` | 是 | UTF-8 字符串 | 1–128 字节，拒绝空值/首尾空白/控制字符，保留大小写 | 无缺省 | 是（原样字节） |
        | `occurred_at` | 是 | RFC 3339 时间字符串，必须带偏移 | 最多 6 位小数秒，拒超精度/闰秒/无偏移 | 无缺省 | 是（UTC、固定 6 位小数、`Z`） |
        | `usage` | 是 | 对象，六个指标可选 | 见 `UsageObject` | 允许六个指标全缺失 | 是（补全为六指标完整对象） |
        | `status` | 否 | UTF-8 字符串 或 `null` | 1–64 字节，拒绝空值/控制字符 | 省略与 `null` 同为“来源不提供” | 是（原样字节或 `null`） |
        | `duration_ms` | 否 | 十进制整数 或 `null` | `[0, 2^53-1]`，`0` 是真实零 | 省略与 `null` 同为“未知” | 是（整数或 `null`） |

        表中 `provider`/`model` 的「首尾空白」按 Unicode `White_Space` 属性判定，**含** U+00A0（NBSP）与 U+3000（全角空格）；完整字符集与 Go 实现注意事项见第 11 节。

        所有字符串长度都按 **UTF-8 字节**校验，不是字符数。事件内出现未知字段时，该项永久 `rejected/INVALID_ARGUMENT`，同批其他项照常处理。

    UsageObject:
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          $ref: '#/components/schemas/MetricValue'
        output_tokens:
          $ref: '#/components/schemas/MetricValue'
        total_tokens:
          $ref: '#/components/schemas/MetricValue'
        cache_read_tokens:
          $ref: '#/components/schemas/MetricValue'
        cache_write_tokens:
          $ref: '#/components/schemas/MetricValue'
        reasoning_tokens:
          $ref: '#/components/schemas/MetricValue'
      description: |
        用量对象，必填；六个指标都**可以省略**（因为最终请求仍可能已发生但没有可用用量），但可选不等于可以随便写成别的组合。

        六个指标固定为 `input_tokens`、`output_tokens`、`total_tokens`、`cache_read_tokens`、`cache_write_tokens`、`reasoning_tokens`；每个只用 `{value, quality}` 三态之一（known / estimated / missing），其他组合非法，见 `MetricValue`。

        - `cache_read_tokens`、`cache_write_tokens` 是 **输入子集**，`reasoning_tokens` 是**输出子集**，都不另加到 total。子集重复累加到总量是错误做法。
        - 省略某个指标与写 `{"value":null,"quality":"missing"}` 等价。但 `total_tokens` 的这两种写法都表示「total 未提供」，会触发第 6.6 节第 2 条的推导，**不是**保留为 missing：例如输入 100 known、输出 20 known 时，省略 total 与显式写 missing 都得到 `total=120 known`。
        - 每指标独立判断质量，禁止用一个全局质量标记覆盖全部字段。
        - 归一化五条规则（子集大小、total 推导与等式、溢出、全缺失仍计事件数）见 `info.description` 第 6.6 节，全部由实现执行，无法用 schema 表达。

        规范化时本对象固定为第 4 个元素，键顺序固定，六个指标全部出现。

    MetricValue:
      oneOf:
        - title: known
          type: object
          additionalProperties: false
          required:
            - value
            - quality
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: 实测或来源确认的真实值，`0` 是**真实零**。必须是十进制整数形式。
            quality:
              const: known
              description: 质量标记，固定为 `known`。
          description: 实测值：`{"value":N,"quality":"known"}`。
        - title: estimated
          type: object
          additionalProperties: false
          required:
            - value
            - quality
          properties:
            value:
              type: integer
              minimum: 0
              maximum: 9007199254740991
              description: 估算值，必填且非负；**估算零不等于真实零**。必须是十进制整数形式。
            quality:
              const: estimated
              description: 质量标记，固定为 `estimated`。
          description: 估算值：`{"value":N,"quality":"estimated"}`。
        - title: missing
          type: object
          additionalProperties: false
          required:
            - value
            - quality
          properties:
            value:
              type: 'null'
              description: 缺失时 `value` 必须是 `null`，不得带任何数值。
            quality:
              const: missing
              description: 质量标记，固定为 `missing`。
          description: 缺失：`{"value":null,"quality":"missing"}`。
      description: |
        单个指标的三种合法形态，仅此三种：

        | 形态 | 含义 | 非法写法 |
        |---|---|---|
        | `{"value":N,"quality":"known"}` | 实测值，N 为 `[0, 2^53-1]` 十进制整数，`0` 是真实零 | 缺 `value`、`value` 为 `null`、用其他质量词 |
        | `{"value":N,"quality":"estimated"}` | 估算值，N 必填且非负 | 同上；估算零不是真实零 |
        | `{"value":null,"quality":"missing"}` | 缺失；整个指标省略与此写法等价 | 给 missing 带数值、缺 `value` |

        其他组合（未知质量词、known/estimated 缺值、missing 带数值、额外字段）都不合法：schema 的 `oneOf` + `additionalProperties: false` 能挡住结构与质量词，但 **JSON 数字词法**（`1.0`、`1e2`、`"100"`、`-0`）与是否溢出只能由实现检查。

    IngestionBatchResponse:
      type: object
      required:
        - request_id
        - results
      properties:
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 不透明、服务端生成，仅用于日志关联；不用于授权，也不是业务身份。整批错误响应里同样出现。
        results:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/ItemResult'
          description: |
            逐项结果。与输入 `events` **等长**、按输入顺序排列，`index` 从 0 开始。

            同一批里出现重复 `source_event_id` 时，每个下标各自给出结果，不得只按 ID 组装（否则会互相覆盖）。不得为了凑长度补 `accepted`。
      description: |
        HTTP 200 的逐项响应。批次已完整解析并逐项处理；逐项业务拒绝不代表整个 HTTP 请求失败，因此统一 200，不用 207。

        六种状态与各自可用的 `error.code` 见 `ItemResultAccepted`、`ItemResultDuplicate`、`ItemResultConflict`、`ItemResultExpired`、`ItemResultRejected`、`ItemResultRetryable`。

        响应对象本身允许未来新增字段（客户端必须忽略），因此这里不加 `additionalProperties: false`；`results` 的元素个数必须与输入 `events` 等长，这是实现要保证的跨字段约束，schema 的 `maxItems: 100` 只是数量上限。

    ItemResult:
      oneOf:
        - $ref: '#/components/schemas/ItemResultAccepted'
        - $ref: '#/components/schemas/ItemResultDuplicate'
        - $ref: '#/components/schemas/ItemResultConflict'
        - $ref: '#/components/schemas/ItemResultExpired'
        - $ref: '#/components/schemas/ItemResultRejected'
        - $ref: '#/components/schemas/ItemResultRetryable'
      description: |
        单条逐项结果，六种状态互斥：

        - `accepted`：本项原始事件与分钟增量均已确认提交（不是入队）。
        - `duplicate`：同身份、同规范化内容，没有新增计数，首次 `received_at` 不变。
        - `conflict`：同身份、不同规范化内容，永久拒绝，不覆盖。
        - `expired`：超出 180 天下界，先于查重判断，即使原记录仍在也不返回 duplicate/conflict。
        - `rejected`：其他永久拒绝，必须带稳定 `error.code`（六选一）。
        - `retryable`：可按原身份重试的本项失败，必须带 `error.code`（`UNAVAILABLE`、`INTERNAL`、`DEADLINE_EXCEEDED` 三选一）。Commit 结果不明也只能用它，不能写 accepted 或声称已回滚。

        前四种状态**不得**带 `error`；后两种**必须**带 `error`。`error.message` 只供人读，不作为分支依据，不含 SQL、堆栈、凭证、事件原文或跨空间资源信息。

    ItemResultBase:
      type: object
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 99
          description: 该结果对应输入 `events` 数组的下标，从 0 开始；同一批内不重复。
        status:
          type: string
          description: 逐项状态。具体取值由各状态 schema 用 `const` 固定。
      description: |
        逐项结果的公共部分（`index` + `status`），供各状态 schema 组合使用，不在响应中单独出现。

        **响应 schema 一律允许未来新增字段**（客户端必须忽略它们），因此这里不加 `additionalProperties: false`；严格拒绝未知字段只针对**请求**。响应中明确约定不允许出现的字段（例如 `accepted` 带 `error`）用 `not: required` 表达。

    ItemResultAccepted:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          properties:
            status:
              const: accepted
          not:
            required:
              - error
      description: 本项已确认提交：原始事件与分钟增量在同一事务内提交成功，`accepted` 只在提交之后返回。
    ItemResultDuplicate:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          properties:
            status:
              const: duplicate
          not:
            required:
              - error
      description: 同身份、同规范化内容；没有新增计数，首次 `received_at` 不变，不延长保留。
    ItemResultConflict:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          properties:
            status:
              const: conflict
          not:
            required:
              - error
      description: |
        同身份、不同规范化内容，永久拒绝；不覆盖事件、不修正分钟桶。

        跨规范化版本时先按第 6.5 节「判别顺序」选出共同版本（优先旧行自身版本，其次序号最大者），仅当双方都能无损形成该版本的全部比较字段时才比较；**全部候选版本都失败时**返回 `rejected/NORMALIZATION_INCOMPATIBLE`，而不是 `conflict`。
    ItemResultExpired:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          properties:
            status:
              const: expired
          not:
            required:
              - error
      description: |
        `occurred_at < T - 180×24h` 的永久拒绝，**先于**任何查重判断。即使原记录仍在也不返回 duplicate/conflict。下界之前不保存身份摘要。

        被改过时间或复用 ID 的内容不承诺识别。
    ItemResultRejected:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          required:
            - error
          properties:
            status:
              const: rejected
            error:
              allOf:
                - $ref: '#/components/schemas/ItemError'
                - type: object
                  properties:
                    code:
                      enum:
                        - INVALID_ARGUMENT
                        - FUTURE_EVENT
                        - PROJECT_INVALID
                        - USAGE_UNSUPPORTED
                        - USAGE_OVERFLOW
                        - NORMALIZATION_INCOMPATIBLE
      description: |
        其他永久项错误，必须带稳定 `error.code`，取值含义：

        | `error.code` | 含义 |
        |---|---|
        | `INVALID_ARGUMENT` | 该项格式不合法：未知字段、字节长度超限、数字不是十进制整数词法、时间形态或日历非法、超精度小数秒 |
        | `FUTURE_EVENT` | `occurred_at > T`（时钟偏差 0 秒，不截断到 `T`） |
        | `PROJECT_INVALID` | 项目非法、跨 workspace 或不可用；不得降级为未归属 |
        | `USAGE_UNSUPPORTED` | 用量组合不合法：known 父项小于 known 子项、三者均 known 但 total 等式不成立、质量词或组合不受支持 |
        | `USAGE_OVERFLOW` | 加法或字段值超出 `2^53-1`；不截断、不转浮点 |
        | `NORMALIZATION_INCOMPATIBLE` | 跨版本比较时经逐一检查不存在双方都能无损形成完整比较集合的共同版本（单个候选版本失败不构成拒绝依据），不能判 duplicate 或 conflict |

        永久拒绝不要原样重试。
    ItemResultRetryable:
      allOf:
        - $ref: '#/components/schemas/ItemResultBase'
        - type: object
          required:
            - error
          properties:
            status:
              const: retryable
            error:
              allOf:
                - $ref: '#/components/schemas/ItemError'
                - type: object
                  properties:
                    code:
                      enum:
                        - UNAVAILABLE
                        - INTERNAL
                        - DEADLINE_EXCEEDED
      description: |
        可按原身份、原内容重试的本项失败，必须带 `error.code`，取值仅三种：

        | `error.code` | 含义 |
        |---|---|
        | `UNAVAILABLE` | 依赖暂时不可用（例如数据库或分钟增量写入失败） |
        | `INTERNAL` | 其他服务端失败，含 Commit 结果不明；不得声称已回滚 |
        | `DEADLINE_EXCEEDED` | 8 秒处理预算到达时该项未开始或结论不确定 |

        重试使用同一 `source_event_id` 与同一内容；已提交过的项会被解析为 `duplicate`。
    ItemError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: 稳定错误码。具体枚举按所属逐项状态限定，见 `ItemResultRejected` 与 `ItemResultRetryable`。
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: 只供人读的说明；**不作为分支依据**，不含 SQL、堆栈、凭证、事件原文或跨空间资源信息。
      description: 逐项错误。`code` 供程序判断，`message` 只供人读。

    BatchErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/BatchError'
      description: |
        整批错误信封，形状为 `error` 对象内包含 `code`、`message`、`request_id` 与可选的 `details`。

        响应对象允许未来新增字段（客户端必须忽略），因此这里不加 `additionalProperties: false`。

    BatchError:
      type: object
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
          enum:
            - INVALID_ARGUMENT
            - UNAUTHENTICATED
            - PERMISSION_DENIED
            - BODY_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - INTERNAL
            - UNAVAILABLE
          description: |
            整批错误码。对应的 HTTP 状态见各响应；本文档只用到七种：

            | HTTP | `code` | 情况 |
            |---|---|---|
            | 400 | `INVALID_ARGUMENT` | JSON 无法解析、重复键、外壳字段/空数组/条数错误 |
            | 401 | `UNAUTHENTICATED` | 凭证缺失或无效 |
            | 403 | `PERMISSION_DENIED` | 已认证但无采集权限 |
            | 413 | `BODY_TOO_LARGE` | 请求体超过 1 MiB |
            | 415 | `UNSUPPORTED_MEDIA_TYPE` | 非 `application/json` |
            | 500 | `INTERNAL` | 形成任何逐项结果之前的服务端故障 |
            | 503 | `UNAVAILABLE` | 形成任何逐项结果之前的依赖故障 |
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: 只供人读；不含 SQL、堆栈、凭证、事件原文或跨空间资源信息。程序分支请用 `code`。
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          description: 不透明、服务端生成，用于日志关联；整批被拒时也提供，便于对账。
        details:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/BatchErrorDetail'
          description: 仅用于安全的字段/原因列表；没有可用信息时省略。不是错误原文，不含跨空间资源信息。
      description: 整批错误体。整批错误意味着**没有写入任何事件**（500/503 除外：无法断定没有已提交项，须按原身份重试）。

    BatchErrorDetail:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 256
          description: 出错的字段位置，用 JSON Pointer（RFC 6901）书写，例如 `/events/0/provider`、`/events`。
        reason:
          type: string
          minLength: 1
          maxLength: 128
          description: 安全的短原因标记，例如 `unknown_field`、`body_not_json`、`too_many_events`、`empty_events`；不包含 SQL 或堆栈。
      description: 单条字段/原因说明。仅供定位与展示，程序分支请用整批 `error.code`。

    AuthRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          description: |
            账号邮箱。服务端先 `TrimSpace` 再整体小写，把它作为唯一存储和登录形式；长度按字节计 3–254，必须恰好一个 `@` 且两侧非空，不含控制字符或空白。这是产品账号格式，不声称实现完整 RFC 邮箱语法。
          example: owner@example.com
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: |
            密码。合法 UTF-8，8–64 个 Unicode 码点且不超过 256 字节；不 trim、不做 Unicode 规范化，哈希的是用户原始字节。响应、日志和错误都不包含它。
          writeOnly: true
      description: |
        注册与登录共用同一请求格式。必须是单个 JSON 对象：未知字段、任何层级的重复键、非法 UTF-8 和尾随内容一律 `400 INVALID_ARGUMENT`；`user_id`、`role`、`workspace`、`email_verified_at`、会话参数等字段都不被接受。请求体上限 16 KiB（`413 BODY_TOO_LARGE`），媒体类型必须是 `application/json`（`415 UNSUPPORTED_MEDIA_TYPE`）。

    AuthUser:
      type: object
      additionalProperties: false
      required:
        - id
        - email
      properties:
        id:
          type: string
          format: uuid
          description: 账号的 UUID v7 身份，由数据库生成。浏览器 API 不会用它代替认证：服务端身份只从会话 Cookie 取得，handler 不读取请求体或路径里的用户 ID。
        email:
          type: string
          description: 规范化后的账号邮箱（已 trim 并小写）。响应不回显密码、密码编码或任何令牌。
      description: 当前会话对应的浏览器账号。

    AuthSession:
      type: object
      additionalProperties: false
      required:
        - user
        - expires_at
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expires_at:
          type: string
          format: date-time
          description: |
            会话到期时间，RFC 3339 格式（UTC，`Z` 结尾）。注册、登录、当前会话三个端点返回的值都等于数据库 `sessions.expires_at`，并与同响应的 Cookie `Expires` 一致。每次有效认证都会把它续到「当前数据库时间 + 30 天」。

    AuthError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - INVALID_CREDENTIALS
                - UNAUTHENTICATED
                - EMAIL_UNAVAILABLE
                - PERMISSION_DENIED
                - REGISTRATION_CLOSED
                - BODY_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - RATE_LIMITED
                - INTERNAL
                - UNAVAILABLE
              description: '程序分支依据。大写枚举值；新增值属向后兼容变更，客户端必须忽略未知值而不是崩溃。'
            message:
              type: string
              description: 面向人的短说明。不含密码、会话令牌、`token_hash`、`password_hash`、数据库 URL 或 SQL。
          description: 单一错误对象。
      description: |
        浏览器认证端点的统一错误体。与采集专用的 `BatchError` 是两个不同 schema，不互相替代；本文不新增请求 ID 系统。

        | code | 状态码 |
        |---|---|
        | `INVALID_ARGUMENT` | 400 |
        | `INVALID_CREDENTIALS` | 401 |
        | `UNAUTHENTICATED` | 401 |
        | `EMAIL_UNAVAILABLE` | 409 |
        | `PERMISSION_DENIED` | 403 |
        | `REGISTRATION_CLOSED` | 403 |
        | `BODY_TOO_LARGE` | 413 |
        | `UNSUPPORTED_MEDIA_TYPE` | 415 |
        | `RATE_LIMITED` | 429 |
        | `INTERNAL` | 500 |
        | `UNAVAILABLE` | 503 |

    ManagementError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - CONFLICT
                - BODY_TOO_LARGE
                - UNSUPPORTED_MEDIA_TYPE
                - INTERNAL
                - UNAVAILABLE
              description: '程序分支依据。新增值属向后兼容变更，客户端必须忽略未知值。'
            message:
              type: string
              description: 面向人的短说明，固定文案，不含 SQL、约束细节、令牌或请求值。
      description: |
        项目与来源管理端点的错误体：

        | code | 状态码 |
        |---|---|
        | `INVALID_ARGUMENT` | 400 |
        | `UNAUTHENTICATED` | 401 |
        | `PERMISSION_DENIED` | 403 |
        | `NOT_FOUND` | 404 |
        | `CONFLICT` | 409 |
        | `BODY_TOO_LARGE` | 413 |
        | `UNSUPPORTED_MEDIA_TYPE` | 415 |
        | `INTERNAL` | 500（成员角色或资源数据库故障） |
        | `UNAVAILABLE` | 503（仅会话存储/续期故障） |

        所有响应带 `Cache-Control: no-store`。

    Project:
      type: object
      additionalProperties: false
      required: [project_id, workspace_id, project_key, name, created_at, archived_at]
      properties:
        project_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        project_key: {type: string, minLength: 1, maxLength: 128, description: '机器标识，创建后不可修改；归档后仍占用唯一键。'}
        name: {type: string, minLength: 1, maxLength: 128}
        created_at: {type: string, format: date-time}
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
          description: '`null` 表示 active；否则为首次归档时间（RFC 3339），重复归档不改变它。'
      description: 一个项目。

    CurrentWorkspace:
      type: object
      additionalProperties: false
      required: [workspace_id, name]
      properties:
        workspace_id:
          type: string
          format: uuid
        name:
          type: string
      description: 当前用户的个人空间身份。

    UsageOptions:
      type: object
      additionalProperties: false
      required: [providers, models]
      properties:
        providers:
          type: array
          items:
            type: string
          description: 去重后按字节序升序的 provider 值；无数据为 `[]`。
        models:
          type: array
          items:
            type: string
          description: 去重后按字节序升序的 model 值；无数据为 `[]`。独立于 providers，不表示组合关系。

    RequestToken:
      type: object
      additionalProperties: false
      required: [value, quality]
      properties:
        value: {type: [integer, 'null'], minimum: 0, maximum: 9007199254740991, description: '`quality=missing` 时必为 null。'}
        quality: {type: string, enum: [known, estimated, missing]}

    RequestDetail:
      type: object
      additionalProperties: false
      required: [id, occurred_at, received_at, provider, model, project, source, input_tokens, output_tokens, total_tokens, status, duration_ms]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        provider: {type: string}
        model: {type: string}
        project:
          type: [object, 'null']
          additionalProperties: false
          required: [id, key, name]
          properties:
            id: {type: string, format: uuid}
            key: {type: string}
            name: {type: string}
        source:
          type: object
          additionalProperties: false
          required: [id, platform, instance_key]
          properties:
            id: {type: string, format: uuid}
            platform: {type: string}
            instance_key: {type: string}
        input_tokens: {$ref: '#/components/schemas/RequestToken'}
        output_tokens: {$ref: '#/components/schemas/RequestToken'}
        total_tokens: {$ref: '#/components/schemas/RequestToken'}
        status: {type: [string, 'null']}
        duration_ms: {type: [integer, 'null'], minimum: 0}

    RequestDetailsResponse:
      type: object
      additionalProperties: false
      required: [items, next_cursor, has_more, start, end, as_of, retention_cutoff]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RequestDetail'}
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        retention_cutoff: {type: string, format: date-time}

    CurrentUsageRateResponse:
      type: object
      additionalProperties: false
      required: [start, end, as_of, window_seconds, unit, total_tokens, window_last_received_at]
      properties:
        start: {type: string, format: date-time}
        end: {type: string, format: date-time}
        as_of: {type: string, format: date-time}
        window_seconds: {type: integer, const: 60}
        unit: {type: string, const: tokens/min}
        total_tokens:
          type: object
          additionalProperties: false
          required: [value, event_count, known_count, estimated_count, missing_count]
          properties:
            value: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)$', description: 'known+estimated 精确和；无可用值为 null。'}
            event_count: {type: integer, minimum: 0}
            known_count: {type: integer, minimum: 0}
            estimated_count: {type: integer, minimum: 0}
            missing_count: {type: integer, minimum: 0}
        window_last_received_at: {type: [string, 'null'], format: date-time}

    ProjectList:
      type: array
      items:
        $ref: '#/components/schemas/Project'
      description: 项目数组（顶层即数组），按 `created_at, id` 升序，含已归档项。

    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [project_key, name]
      properties:
        project_key: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 128}

    ProjectUpdateRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}

    Source:
      type: object
      additionalProperties: false
      required: [source_id, workspace_id, platform, instance_key, created_at, last_received_at, archived_at]
      properties:
        source_id: {type: string, format: uuid}
        workspace_id: {type: string, format: uuid}
        platform: {type: string, minLength: 1, maxLength: 128}
        instance_key: {type: string, minLength: 1, maxLength: 128}
        created_at: {type: string, format: date-time}
        last_received_at:
          type:
            - string
            - 'null'
          format: date-time
          description: '`null` 表示从未收到数据。归档前已认证的采集请求可能在归档后仍更新它。'
        archived_at:
          type:
            - string
            - 'null'
          format: date-time
          description: '`null` 表示 active；否则为首次归档时间。重复归档不改变它。'
      description: 一个数据来源。

    SourceList:
      type: array
      items:
        $ref: '#/components/schemas/Source'
      description: 来源数组（顶层即数组），按 `created_at, id` 升序，含已归档项。

    SourceCreateRequest:
      type: object
      additionalProperties: false
      required: [platform, instance_key]
      properties:
        platform: {type: string, minLength: 1, maxLength: 128}
        instance_key: {type: string, minLength: 1, maxLength: 128}

    SourceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        platform: {type: string, minLength: 1, maxLength: 128}
        instance_key: {type: string, minLength: 1, maxLength: 128}
      description: 至少一个字段；只改机器标识，`source_id`、凭证绑定与令牌不变。

    CredentialList:
      type: object
      additionalProperties: false
      required:
        - credentials
      properties:
        credentials:
          type: array
          description: |
            路径 `workspaceID` 与 `sourceID` 下的全部凭证元数据，包括已撤销的，按创建顺序排列。该 source 存在但还没有凭证时是空数组；source 不属于该 workspace 时整个响应是 `404 NOT_FOUND`，不会返回空数组。

            这里只列元数据：明文令牌只在签发/轮换响应中出现一次，列表不能恢复它，也不返回 `secret_hash` 或任何摘要派生值。
          items:
            $ref: '#/components/schemas/Credential'
      description: owner 管理的凭证列表响应。字段直接放在顶层，不使用统一响应包装。

    Credential:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - workspace_id
        - source_id
        - revoked_at
      properties:
        credential_id:
          type: string
          format: uuid
          description: '凭证的 UUID 身份。签发/轮换响应丢失后，owner 用它定位多余凭证并调用撤销。'
        workspace_id:
          type: string
          format: uuid
          description: '凭证创建时固定的 workspace。轮换不会改变它。'
        source_id:
          type: string
          format: uuid
          description: '凭证创建时固定的 source。轮换不会改变它，撤销也不会删除 source。'
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
          description: '撤销时间（RFC 3339，UTC）。`null` 表示凭证仍有效。重复撤销保留首次时间；轮换既不撤销也不复活旧凭证，因此这里如实反映旧凭证的原有状态。'
      description: 一条凭证的元数据。不含 `token`、`secret_hash` 或摘要派生值。

    IssuedCredential:
      type: object
      additionalProperties: false
      required:
        - credential_id
        - workspace_id
        - source_id
        - token
      properties:
        credential_id:
          type: string
          format: uuid
          description: 新创建凭证的 UUID 身份。
        workspace_id:
          type: string
          format: uuid
          description: 固定 workspace，取自路径或旧凭证行，不取自请求体。
        source_id:
          type: string
          format: uuid
          description: 固定 source，取自路径或旧凭证行。轮换时客户端不能指定新 source。
        token:
          type: string
          description: |
            一次性明文令牌，形如 `tpk_` + 随机串（随机部分长度由签发方决定，客户端不得硬编码）。插件以 `Authorization: Bearer <token>` 使用。

            只在本响应中出现一次；数据库只保存完整令牌的 SHA-256 摘要，无法再次取回明文。响应丢失时用列表取得 credential ID 并撤销多余凭证，或再次签发/轮换；不要为了重放响应而缓存明文。
      description: |
        签发与轮换的成功响应。新凭证创建时总是有效，因此不返回 `revoked_at`。

        签发与轮换都不是幂等操作：超时或 5xx 后重试可能创建多个有效凭证，客户端在收到成功响应前不应自动重放。

    CredentialError:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_ARGUMENT
                - UNAUTHENTICATED
                - PERMISSION_DENIED
                - NOT_FOUND
                - CONFLICT
                - INTERNAL
                - UNAVAILABLE
              description: '程序分支依据。新增值属向后兼容变更，客户端必须忽略未知值而不是崩溃。'
            message:
              type: string
              description: 面向人的短说明。不含令牌、`secret_hash`、会话令牌、数据库 URL 或 SQL。
          description: 单一错误对象。
      description: |
        owner 管理凭证端点的错误体，形状与 `AuthError` 相同，但按这些端点实际返回的码范围收敛：

        | code | 状态码 | 情况 |
        |---|---|---|
        | `INVALID_ARGUMENT` | 400 | 请求体非空，或路径参数不是合法 UUID |
        | `UNAUTHENTICATED` | 401 | 无 Cookie，或会话不可用 |
        | `PERMISSION_DENIED` | 403 | 写操作 `Origin` 不合法，或会话用户不是该 workspace 的 owner |
        | `NOT_FOUND` | 404 | source/credential 不存在或不属于路径 workspace |
        | `CONFLICT` | 409 | 签发/轮换时来源已归档（固定消息 `source is archived`） |
        | `INTERNAL` | 500 | 数据库等服务端故障；不假装成功 |
        | `UNAVAILABLE` | 503 | 会话存储等依赖不可用；请求在读取或创建凭证前停止 |

        所有响应都带 `Cache-Control: no-store`。插件令牌 `tpk_` 不能用于这些端点：管理 API 只认浏览器会话 Cookie。

    DecimalString:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: '无符号规范十进制整数字符串：`0` 或首位 1–9；无前导零、小数点、指数或正负号。用字符串是为了超过 2^53-1 或 int64 的聚合值不被浏览器或 int64 舍入；不是 integer。'
    UsageMetricStats:
      type: object
      additionalProperties: false
      required: [value, known_count, estimated_count, missing_count]
      properties:
        value:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
          description: 'known 与 estimated 值之和；known_count 与 estimated_count 都为 "0" 时为 null（缺失不等于零）。已知或估算的 0 返回 "0"，由计数区分。'
        known_count:
          $ref: '#/components/schemas/DecimalString'
        estimated_count:
          $ref: '#/components/schemas/DecimalString'
        missing_count:
          $ref: '#/components/schemas/DecimalString'
    UsageStats:
      type: object
      additionalProperties: false
      required: [request_count, input_tokens, output_tokens, total_tokens, cache_read_tokens, cache_write_tokens, reasoning_tokens]
      description: 'request_count 是分钟表 event_count 之和（已接受的请求级最终事件数，全部 token 缺失的事件也计入）。total_tokens 直接汇总存储的 total，不由 input+output 重算；缓存与推理仅作独立子集返回，不加入 total。'
      properties:
        request_count:
          $ref: '#/components/schemas/DecimalString'
        input_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
        output_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
        total_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
        cache_read_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
        cache_write_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
        reasoning_tokens:
          $ref: '#/components/schemas/UsageMetricStats'
    UsageRangeBase:
      type: object
      additionalProperties: false
      required: [start, end, as_of, retention_cutoff]
      properties:
        start:
          type: string
          format: date-time
          description: 'UTC（`Z`）RFC 3339。'
        end:
          type: string
          format: date-time
          description: '有效上界 effectiveEnd：显式 end，或省略时的 as_of。'
        as_of:
          type: string
          format: date-time
          description: '本次请求（或游标）采样的统计截点；end 省略时等于 end。'
        retention_cutoff:
          type: string
          format: date-time
          description: |
            当次保留截点：当前 UTC 时刻向过去 13 个日历月，秒归零；原日在目标月不存在时统一取目标月下一月 1 日 00:00 UTC（截点单调不减）。例：2027-03-28T23:59:59Z 的截点是 2026-02-28T23:59:00Z；2027-03-29T00:00:00Z 起到 3 月末均为 2026-03-01T00:00:00Z。与展示 timezone 无关。
    UsageAggregateRange:
      type: object
      additionalProperties: false
      required: [start, end, as_of, retention_cutoff, timezone, granularity]
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        as_of:
          type: string
          format: date-time
        retention_cutoff:
          type: string
          format: date-time
        timezone:
          type: string
        granularity:
          type: string
          enum: [minute, hour, day]
      description: '字段含义同 UsageRangeBase，另回传请求的 timezone 与 granularity。'
    UsageAggregatePoint:
      type: object
      additionalProperties: false
      required: [bucket_start, bucket_end, partial, stats]
      properties:
        bucket_start:
          type: string
          format: date-time
        bucket_end:
          type: string
          format: date-time
          description: '下一真实桶边界，不固定加 1 小时或 24 小时。'
        partial:
          type: boolean
          description: '该桶被请求 start/effectiveEnd 截断；只表示时间覆盖，不表示指标质量。'
        stats:
          $ref: '#/components/schemas/UsageStats'
    UsageAggregateResponse:
      type: object
      additionalProperties: false
      required: [range, totals, points]
      properties:
        range:
          $ref: '#/components/schemas/UsageAggregateRange'
        totals:
          $ref: '#/components/schemas/UsageStats'
        points:
          type: array
          maxItems: 1000
          description: '按 bucket_start 升序；只含有数据的桶，不零填充。'
          items:
            $ref: '#/components/schemas/UsageAggregatePoint'
    UsageRankingKey:
      type: object
      description: 'project：{project_id: uuid|null}；provider：{provider}；model：{provider, model}。'
      properties:
        project_id:
          type: [string, 'null']
          format: uuid
        provider:
          type: string
        model:
          type: string
    UsageRankingGroup:
      type: object
      additionalProperties: false
      required: [key, share, stats]
      properties:
        key:
          $ref: '#/components/schemas/UsageRankingKey'
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        stats:
          $ref: '#/components/schemas/UsageStats'
    UsageRankingOther:
      type: object
      additionalProperties: false
      required: [share, stats]
      properties:
        share:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        stats:
          $ref: '#/components/schemas/UsageStats'
    UsageRankingsResponse:
      type: object
      additionalProperties: false
      required: [range, group_by, overall, groups, other, next_cursor]
      properties:
        range:
          $ref: '#/components/schemas/UsageRangeBase'
        group_by:
          type: string
          enum: [project, provider, model]
        overall:
          $ref: '#/components/schemas/UsageStats'
        groups:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/UsageRankingGroup'
        other:
          oneOf:
            - $ref: '#/components/schemas/UsageRankingOther'
            - type: 'null'
          description: '本页之后全部剩余组的聚合；无剩余时为 null。'
        next_cursor:
          type: [string, 'null']
          description: '不透明游标；无剩余组时为 null。不是授权凭据。'
    UsageError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT, OUTSIDE_RETENTION, TOO_MANY_POINTS, UNAUTHENTICATED, PERMISSION_DENIED, INTERNAL, UNAVAILABLE]
              description: '程序分支依据；客户端必须忽略未知值。'
            message:
              type: string
              description: '面向人的短说明，不回显请求值、SQL 或数据库消息。'
            details:
              description: '仅 OUTSIDE_RETENTION 与 TOO_MANY_POINTS 带 details，其余错误不带该字段。'
              oneOf:
                - type: object
                  title: OutsideRetentionDetails
                  additionalProperties: false
                  required: [retention_cutoff]
                  properties:
                    retention_cutoff:
                      type: string
                      format: date-time
                - type: object
                  title: TooManyPointsDetails
                  additionalProperties: false
                  required: [max_points, suggested_granularity]
                  properties:
                    max_points:
                      type: integer
                      const: 1000
                    suggested_granularity:
                      description: '比请求粒度更粗且满足上限的最细粒度；null 表示只能缩短范围。'
                      oneOf:
                        - type: string
                          enum: [hour, day]
                        - type: 'null'
      description: |
        聚合查询端点的错误体。

        | code | 状态码 | 情况 |
        |---|---|---|
        | `INVALID_ARGUMENT` | 400 | 参数、UUID、时区、范围、分钟对齐、筛选数量或游标非法 |
        | `OUTSIDE_RETENTION` | 400 | start 早于当次保留截点；details.retention_cutoff |
        | `TOO_MANY_POINTS` | 400 | 趋势桶数超过 1000；details.max_points、details.suggested_granularity |
        | `UNAUTHENTICATED` | 401 | 无有效会话 |
        | `PERMISSION_DENIED` | 403 | 非 workspace 成员 |
        | `INTERNAL` | 500 | 成员查询、SQL、格式化或未知角色故障 |
        | `UNAVAILABLE` | 503 | 会话等认证依赖不可用 |

  examples:
    MixedBatchRequest:
      summary: 混合批次（六项，对应六种逐项状态）
      description: |
        示例时间基准固定为 `T = 2026-10-27T14:00:00Z`，因此 180 天下界为 `2026-04-30T14:00:00.000000Z`；真实请求按服务端当时的 `T` 判断。本示例符合 schema，其中第 4 项的 `1.0` 是刻意展示“schema 判为整数、实现必须拒绝”的数字词法案例（`rejected/INVALID_ARGUMENT` 属逐项结果，不影响整体 200）。

        - 第 0 项：全新合法事件，预期 `accepted`。
        - 第 1 项：与第 0 项同 `source_event_id`、规范化内容相同但键顺序不同，预期 `duplicate`。
        - 第 2 项：服务端此前已有同身份、不同内容的事件（请求本身不携带该前提），预期 `conflict`。
        - 第 3 项：`occurred_at` 早于下界，预期 `expired`。
        - 第 4 项：`total_tokens.value` 写作 `1.0`，预期 `rejected/INVALID_ARGUMENT`。
        - 第 5 项：合法内容，但处理时遇到依赖超时，预期 `retryable/UNAVAILABLE`。
      value:
        events:
          - source_event_id: req-0001
            project_id: 0199a0b0-0000-7000-8000-00000000000a
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T06:59:30.250000-07:00'
            usage:
              input_tokens:
                value: 1200
                quality: known
              output_tokens:
                value: 300
                quality: known
              cache_read_tokens:
                value: 400
                quality: known
              reasoning_tokens:
                value: 120
                quality: known
            status: success
            duration_ms: 2400
          - source_event_id: req-0001
            model: example-model
            provider: example-provider
            occurred_at: '2026-10-27T13:59:30.250000Z'
            status: success
            duration_ms: 2400
            project_id: 0199A0B0-0000-7000-8000-00000000000A
            usage:
              input_tokens:
                quality: known
                value: 1200
              output_tokens:
                quality: known
                value: 300
              reasoning_tokens:
                quality: known
                value: 120
              cache_read_tokens:
                quality: known
                value: 400
          - source_event_id: req-0003
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T04:00:00Z'
            usage:
              input_tokens:
                value: 800
                quality: known
              output_tokens:
                value: 90
                quality: estimated
            status: success
            duration_ms: 700
          - source_event_id: req-0004
            project_id: null
            provider: example-provider
            model: example-model
            occurred_at: '2026-04-29T13:59:59.999999Z'
            usage:
              input_tokens:
                value: 10
                quality: known
            status: success
            duration_ms: 0
          - source_event_id: req-0005
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T13:00:00Z'
            usage:
              total_tokens:
                value: 1.0
                quality: known
          - source_event_id: req-0006
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T13:59:59.500000Z'
            usage:
              input_tokens:
                value: 42
                quality: known
            status: success
    MixedBatchResponse:
      summary: 混合批次的逐项结果（与请求示例同名配对）
      description: 六项结果与请求示例逐下标对应：`accepted`、`duplicate`、`conflict`、`expired`、`rejected/INVALID_ARGUMENT`、`retryable/UNAVAILABLE`。
      value:
        request_id: 6a0f0c3e-8f4a-4d7e-9b1a-2c5d3e4f5a60
        results:
          - index: 0
            status: accepted
          - index: 1
            status: duplicate
          - index: 2
            status: conflict
          - index: 3
            status: expired
          - index: 4
            status: rejected
            error:
              code: INVALID_ARGUMENT
              message: numeric value must be written as a decimal integer
          - index: 5
            status: retryable
            error:
              code: UNAVAILABLE
              message: temporarily unavailable
    DuplicateSourceEventIdRequest:
      summary: 同批重复 ID（内容相同，键顺序不同）
      description: |
        两项使用同一个 `source_event_id` 且规范化内容相同（只有字段顺序不同）。响应必须仍是两项、下标 0 与 1 各一条，不能只按 ID 组装而互相覆盖。第 0 项首次提交为 `accepted`，第 1 项因同身份同内容为 `duplicate`。
      value:
        events:
          - source_event_id: req-dup-01
            project_id: 0199a0b0-0000-7000-8000-00000000000b
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T05:00:00-07:00'
            usage:
              input_tokens:
                value: 300
                quality: known
              output_tokens:
                value: 60
                quality: known
            status: success
            duration_ms: 800
          - source_event_id: req-dup-01
            occurred_at: '2026-10-27T12:00:00Z'
            provider: example-provider
            model: example-model
            project_id: 0199A0B0-0000-7000-8000-00000000000B
            duration_ms: 800
            status: success
            usage:
              output_tokens:
                quality: known
                value: 60
              input_tokens:
                quality: known
                value: 300
    DuplicateSourceEventIdResponse:
      summary: 同批重复 ID 的逐项结果
      description: 响应与输入等长（2 项），`index` 稳定；重复 ID 没有合并成一条。
      value:
        request_id: 0b7d1e5a-3c9f-4a8b-9e2d-5f6a7b8c9d01
        results:
          - index: 0
            status: accepted
          - index: 1
            status: duplicate
    MissingZeroEstimatedRequest:
      summary: 缺失、真实零、估算零
      description: |
        三项分别展示“输入 token 是真实零”“输入 token 是估算零且输出缺失”“六个指标全部省略”。三者都合法且互不相同：真实零与估算零的摘要不同，估算零与缺失也不同。
      value:
        events:
          - source_event_id: req-zero-01
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T00:00:00Z'
            usage:
              input_tokens:
                value: 0
                quality: known
            duration_ms: 0
          - source_event_id: req-zero-02
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T00:00:00Z'
            usage:
              input_tokens:
                value: 0
                quality: estimated
            duration_ms: 0
          - source_event_id: req-zero-03
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T00:00:00Z'
            usage: {}
    MissingZeroEstimatedResponse:
      summary: 三项均合法接受（用量可用性不同）
      description: 第 2 项全部指标缺失仍然接受并计事件数，但用量显示不可用；它不是零用量事件。
      value:
        request_id: 9c1b2d3e-4f5a-4b6c-8d9e-0f1a2b3c4d5e
        results:
          - index: 0
            status: accepted
          - index: 1
            status: accepted
          - index: 2
            status: accepted
    TotalOnlyRequest:
      summary: 仅提供 total
      description: |
        输入与输出都缺失，只提供 `total_tokens`。合法：保留来源的 total 及其质量，不反推输入/输出，也不把唯一已知分量当成完整 total。
      value:
        events:
          - source_event_id: req-total-01
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T02:30:00Z'
            usage:
              total_tokens:
                value: 500
                quality: known
            status: success
    TotalOnlyResponse:
      summary: 仅提供 total 的结果
      value:
        request_id: 1f2e3d4c-5b6a-4978-8a7b-6c5d4e3f2a1b
        results:
          - index: 0
            status: accepted
    CacheAndReasoningSubsetRequest:
      summary: 缓存/推理子集与 total 推导：一项合法、三项跨字段非法
      description: |
        第 0 项：`cache_read_tokens` 400 是 `input_tokens` 1000 的 known 子集，`reasoning_tokens` 80 是 `output_tokens` 200 的 known 子集，子集不另加到 total；省略 total，由 1000 + 200 补为 1200 known。合法。

        第 1 项：输入与输出都是 `2^53-1 = 9007199254740991` 且省略 total，按规则应补出的 total 超出上限，因此该项永久 `USAGE_OVERFLOW`（不截断、不转浮点）。

        第 2 项：`input_tokens` 50 known 而 `cache_read_tokens` 60 known，known 子集大于 known 父项，永久 `USAGE_UNSUPPORTED`。（若父项是 estimated 则不比大小，属合法。）

        第 3 项：输入 100、输出 20、total 130 **三者均为 known**，等式不成立，永久 `USAGE_UNSUPPORTED`。若 total 是 estimated，或输入/输出有任一非 known，则不因等式不成立而拒绝。

        后三项的每个字段单独看都在 `maximum` 之内，所以都是**跨字段**非法：schema 通过，实现拒绝。这一组同时是“子集不重复累加”“total 推导与等式检查”的正反例。
      value:
        events:
          - source_event_id: req-subset-01
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T03:00:00Z'
            usage:
              input_tokens:
                value: 1000
                quality: known
              output_tokens:
                value: 200
                quality: known
              cache_read_tokens:
                value: 400
                quality: known
              cache_write_tokens:
                value: 100
                quality: known
              reasoning_tokens:
                value: 80
                quality: known
            status: success
            duration_ms: 1500
          - source_event_id: req-subset-02
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T03:00:01Z'
            usage:
              input_tokens:
                value: 9007199254740991
                quality: known
              output_tokens:
                value: 9007199254740991
                quality: known
          - source_event_id: req-subset-03
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T03:00:02Z'
            usage:
              input_tokens:
                value: 50
                quality: known
              output_tokens:
                value: 10
                quality: known
              cache_read_tokens:
                value: 60
                quality: known
          - source_event_id: req-subset-04
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T03:00:03Z'
            usage:
              input_tokens:
                value: 100
                quality: known
              output_tokens:
                value: 20
                quality: known
              total_tokens:
                value: 130
                quality: known
    CacheAndReasoningSubsetResponse:
      summary: 子集与 total 推导示例的结果（一项接受、三项跨字段拒绝）
      value:
        request_id: 7a8b9c0d-1e2f-4a3b-9c4d-5e6f7a8b9c0d
        results:
          - index: 0
            status: accepted
          - index: 1
            status: rejected
            error:
              code: USAGE_OVERFLOW
              message: derived total_tokens exceeds 2^53-1
          - index: 2
            status: rejected
            error:
              code: USAGE_UNSUPPORTED
              message: known cache_read_tokens exceeds known input_tokens
          - index: 3
            status: rejected
            error:
              code: USAGE_UNSUPPORTED
              message: known total_tokens does not equal known input_tokens plus output_tokens
    DeadlineExhaustedRequest:
      summary: 处理期限耗尽的 6 项批次（与响应示例同名配对）
      description: |
        6 项按输入顺序处理，响应示例与之下标逐项对应：

        - 第 0 项：全新合法事件，预期 `accepted`。
        - 第 1 项：与第 0 项同 `source_event_id`、规范化内容相同（只有字段顺序不同），预期 `duplicate`。
        - 第 2 项：`input_tokens` 50 known 而 `cache_read_tokens` 60 known，known 子集大于 known 父项，预期 `rejected/USAGE_UNSUPPORTED`。
        - 第 3–5 项：本身都是合法事件，但在 8 秒预算耗尽时尚未开始，预期 `retryable/DEADLINE_EXCEEDED`。

        请求载荷里不出现 `workspace_id`、`source_id`、凭证 ID 与 `received_at`；身份只从认证取得。第 1 项之所以是 `duplicate` 而不是 `accepted`，是因为它在同批内排在第 0 项之后处理、且内容与第 0 项完全相同——不依赖任何未在请求中体现的外部前提。
      value:
        events:
          - source_event_id: req-dl-01
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T13:58:00Z'
            usage:
              input_tokens:
                value: 100
                quality: known
              output_tokens:
                value: 20
                quality: known
            status: success
            duration_ms: 500
          - source_event_id: req-dl-01
            occurred_at: '2026-10-27T13:58:00Z'
            provider: example-provider
            model: example-model
            usage:
              output_tokens:
                quality: known
                value: 20
              input_tokens:
                quality: known
                value: 100
            duration_ms: 500
            status: success
          - source_event_id: req-dl-03
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T13:58:10Z'
            usage:
              input_tokens:
                value: 50
                quality: known
              output_tokens:
                value: 10
                quality: known
              cache_read_tokens:
                value: 60
                quality: known
          - source_event_id: req-dl-04
            provider: example-provider
            model: example-model
            occurred_at: '2026-10-27T13:58:20Z'
            usage:
              input_tokens:
                value: 300
                quality: known
              output_tokens:
                value: 40
                quality: known
          - source_event_id: req-dl-05
            provider: example-provider
