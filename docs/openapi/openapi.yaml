        撤销可安全重试：重复撤销保留首次 `revoked_at` 并返回相同的 `204`。撤销只更新凭证行，不删除 source、事件或防重依据，因此之后为同 source 签发新凭证并重传旧请求仍按原防重规则处理。

        生效边界：撤销提交后**开始**的认证都会失败，但提交前已通过认证的在途请求允许完成，本端点不提供全局即时停用。

        请求体必须为空。写操作必须携带可信 `Origin`，准入顺序与签发相同（`Origin` → 会话 → owner → 请求体 → `credentialID` 解析 → 数据库）。凭证不属于路径 workspace 时返回 `404 NOT_FOUND`，且不泄露其存在性。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: '凭证已撤销，或本就处于撤销状态；无响应体。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          description: '`INVALID_ARGUMENT`：请求体非空，或路径参数不是合法 UUID。不创建也不修改凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: request body must be empty
        '401':
          description: '`UNAUTHENTICATED`：无 Cookie，或会话不可用。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：`Origin` 不合法或会话用户不是该 workspace 的 owner。不创建也不修改凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace owner required
        '404':
          description: '`NOT_FOUND`：凭证不存在或不属于路径 workspace。原凭证状态不变。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: NOT_FOUND
                  message: credential resource not found
        '500':
          $ref: '#/components/responses/AuthInternal'
        '503':
          $ref: '#/components/responses/CredentialUnavailable'

  /api/v1/workspaces/{workspaceID}/usage/aggregate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags:
        - usage
      operationId: getUsageAggregate
      summary: 查询总量与时间趋势
      description: |
        返回筛选后的总量 `totals` 与按 `granularity` 分桶的趋势 `points`。同一组 provider/model/project 筛选同时作用于两者；`totals` 与 `points` 来自同一条 SQL 语句的同一快照，因此 `totals` 等于各点之和。

        **范围**：`[start, end)`，UTC instant。`start`/`end` 必须是带偏移且分钟对齐（秒与小数秒为 0）的 RFC 3339 时间，否则 `400 INVALID_ARGUMENT`；不做取整。省略 `end` 时使用本次请求只采样一次的服务端当前时刻 `as_of`（可带秒与小数秒，包含当前未完成分钟）；显式 `end` 不得晚于 `as_of`。`start` 早于保留截点返回 `400 OUTSIDE_RETENTION`，`start` 等于截点合法。保留截点 `retention_cutoff` 的算法见 `UsageRangeBase`。

        **分桶**：`minute` 为 UTC 分钟；`hour` 的桶键是（本地年月日时, 该时刻的 UTC offset），本地小时或 offset 任一变化即换桶，所以重复小时不合并，半小时 offset 变化（如 `Australia/Lord_Howe`）会产生非整点边界；`day` 的桶键是本地年月日，23/25 小时的自然日各算一天。所有桶边界由服务端一次算出，`bucket_end` 是下一真实边界，不固定加 1 小时或 24 小时；响应的 `bucket_start`/`bucket_end` 是 UTC instant。被请求范围截断的首尾桶（以及 `end` 省略时包含的当前未完成桶）`partial=true`；换粒度不改变 `totals`。**不生成空桶、不零填充**。

        **点数上限**：相交桶数超过 **1000** 返回 `400 TOO_MANY_POINTS`，`error.details` 为 `{max_points: 1000, suggested_granularity: hour|day|null}`（比请求粒度更粗、满足上限的最细粒度；`null` 表示只能缩短范围）。服务端不截断 points，也不静默改变粒度。

        **数值**：所有聚合值与计数都是十进制字符串（`DecimalString`），超过 JavaScript 安全整数或 int64 也逐位准确；仅缺失的 `MetricStats.value` 为 `null`。单事件采集的 JSON integer 格式不受影响。

        **授权**：先会话，再 workspace 成员角色（owner 与 member 可读），然后才校验参数与保留截点、执行查询。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UsageStart'
        - $ref: '#/components/parameters/UsageEnd'
        - $ref: '#/components/parameters/UsageTimezone'
        - $ref: '#/components/parameters/UsageGranularity'
        - $ref: '#/components/parameters/UsageProvider'
        - $ref: '#/components/parameters/UsageModel'
        - $ref: '#/components/parameters/UsageProject'
      responses:
        '200':
          description: '筛选后的总量与趋势。无匹配行时 `totals.request_count="0"`、六指标 `value=null` 且计数为 `"0"`，`points=[]`。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAggregateResponse'
              example:
                range:
                  start: '2026-10-28T00:00:00Z'
                  end: '2026-10-28T01:30:00.123456Z'
                  as_of: '2026-10-28T01:30:00.123456Z'
                  retention_cutoff: '2025-09-28T01:30:00Z'
                  timezone: UTC
                  granularity: hour
                totals:
                  request_count: '2'
                  input_tokens: {value: '100', known_count: '1', estimated_count: '0', missing_count: '1'}
                  output_tokens: {value: '20', known_count: '1', estimated_count: '0', missing_count: '1'}
                  total_tokens: {value: '120', known_count: '1', estimated_count: '0', missing_count: '1'}
                  cache_read_tokens: {value: '60', known_count: '1', estimated_count: '0', missing_count: '1'}
                  cache_write_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                  reasoning_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                points:
                  - bucket_start: '2026-10-28T01:00:00Z'
                    bucket_end: '2026-10-28T02:00:00Z'
                    partial: true
                    stats:
                      request_count: '2'
                      input_tokens: {value: '100', known_count: '1', estimated_count: '0', missing_count: '1'}
                      output_tokens: {value: '20', known_count: '1', estimated_count: '0', missing_count: '1'}
                      total_tokens: {value: '120', known_count: '1', estimated_count: '0', missing_count: '1'}
                      cache_read_tokens: {value: '60', known_count: '1', estimated_count: '0', missing_count: '1'}
                      cache_write_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                      reasoning_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
        '400':
          description: '`INVALID_ARGUMENT`（参数、UUID、时区、范围、分钟对齐、筛选数量或游标非法）、`OUTSIDE_RETENTION`（start 早于当次保留截点，`details.retention_cutoff` 为该截点）或 `TOO_MANY_POINTS`（相交桶数超过 1000，`details` 含 `max_points` 与 `suggested_granularity`）。均不执行聚合 SQL。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: OUTSIDE_RETENTION
                  message: start is before the retention cutoff
                  details:
                    retention_cutoff: '2025-09-28T01:30:00Z'
        '401':
          description: '`UNAUTHENTICATED`：无有效浏览器会话。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：会话有效但不是该 workspace 的成员。不返回数据，不执行聚合。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace membership required
        '500':
          description: '`INTERNAL`：成员查询、聚合 SQL、十进制格式化或未知角色等非预期故障。不返回伪空结果，响应不含 SQL 或数据库消息。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INTERNAL
                  message: internal error
        '503':
          description: '`UNAVAILABLE`：会话续期等认证依赖不可用，请求在查询前停止。按原请求重试。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAVAILABLE
                  message: service is unavailable
  /api/v1/workspaces/{workspaceID}/usage/rankings:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
    get:
      tags:
        - usage
      operationId: getUsageRankings
      summary: 查询分组排名与“其他”
      description: |
        按 `project`、`provider` 或 `model` 分组并按 `total_tokens` 的可展示 sum 降序排名（值相同按稳定分组键升序；project 的 NULL 键排最后；provider/model 按 C 排序规则）。`model` 的分组键是 `(provider, model)`，同名模型跨供应商不合并。同一条 SQL 给出整体 `overall`、本页 `groups` 与本页之后全部剩余组的聚合 `other`。

        范围、筛选、授权、保留截点、数值字符串规则与 `usage/aggregate` 相同。`limit` 默认 10、最大 50。展开“其他”时传上一响应的 `next_cursor` 并**重复原有全部查询参数**；游标只承载分页位置、原 `as_of` 与查询摘要，**不是授权凭据**——每页仍重新做会话、成员角色与当次保留截点检查（原 `start` 已早于新截点则 `400 OUTSIDE_RETENTION`）。参数与游标摘要不一致、游标格式非法一律 `400 INVALID_ARGUMENT`。

        **分页一致性**：游标固定统计上界但不冻结分组值或排名；分钟数据被补报修改时，跨页可能重排，不承诺无重复/无遗漏。静态数据下严格无重复、无遗漏；需要最新首屏时重新请求第一页。

        `share` 是该组 `total_tokens` 可展示 sum 除以 `overall.total_tokens` 可展示 sum 的浮点近似（0–1），分母为 0 或 null、或该组 `value` 为 null 时为 `null`。它不是账单比例，也不能用于反推精确 token。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/UsageStart'
        - $ref: '#/components/parameters/UsageEnd'
        - $ref: '#/components/parameters/UsageGroupBy'
        - $ref: '#/components/parameters/UsageLimit'
        - $ref: '#/components/parameters/UsageCursor'
        - $ref: '#/components/parameters/UsageProvider'
        - $ref: '#/components/parameters/UsageModel'
        - $ref: '#/components/parameters/UsageProject'
      responses:
        '200':
          description: '分组排名。无匹配行时 `overall` 为零值统计，`groups=[]`，`other` 与 `next_cursor` 为 `null`。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageRankingsResponse'
              example:
                range:
                  start: '2026-10-28T00:00:00Z'
                  end: '2026-10-28T01:30:00.123456Z'
                  as_of: '2026-10-28T01:30:00.123456Z'
                  retention_cutoff: '2025-09-28T01:30:00Z'
                group_by: model
                overall:
                  request_count: '2'
                  input_tokens: {value: '100', known_count: '1', estimated_count: '0', missing_count: '1'}
                  output_tokens: {value: '20', known_count: '1', estimated_count: '0', missing_count: '1'}
                  total_tokens: {value: '120', known_count: '1', estimated_count: '0', missing_count: '1'}
                  cache_read_tokens: {value: '60', known_count: '1', estimated_count: '0', missing_count: '1'}
                  cache_write_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                  reasoning_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                groups:
                  - key: {provider: example-provider, model: example-model}
                    share: 1.0
                    stats:
                      request_count: '2'
                      input_tokens: {value: '100', known_count: '1', estimated_count: '0', missing_count: '1'}
                      output_tokens: {value: '20', known_count: '1', estimated_count: '0', missing_count: '1'}
                      total_tokens: {value: '120', known_count: '1', estimated_count: '0', missing_count: '1'}
                      cache_read_tokens: {value: '60', known_count: '1', estimated_count: '0', missing_count: '1'}
                      cache_write_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                      reasoning_tokens: {value: null, known_count: '0', estimated_count: '0', missing_count: '2'}
                other: null
                next_cursor: null
        '400':
          description: '`INVALID_ARGUMENT`（参数、UUID、范围、分钟对齐、筛选数量或游标非法）或 `OUTSIDE_RETENTION`（start 早于当次保留截点，含过期分页，`details.retention_cutoff` 为该截点）。均不执行聚合 SQL。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: OUTSIDE_RETENTION
                  message: start is before the retention cutoff
                  details:
                    retention_cutoff: '2025-09-28T01:30:00Z'
        '401':
          description: '`UNAUTHENTICATED`：无有效浏览器会话。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：会话有效但不是该 workspace 的成员。不返回数据，不执行聚合。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace membership required
        '500':
          description: '`INTERNAL`：成员查询、聚合 SQL、十进制格式化或未知角色等非预期故障。不返回伪空结果，响应不含 SQL 或数据库消息。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: INTERNAL
                  message: internal error
        '503':
          description: '`UNAVAILABLE`：会话续期等认证依赖不可用，请求在查询前停止。按原请求重试。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageError'
              example:
                error:
                  code: UNAVAILABLE
                  message: service is unavailable

  /api/v1/workspaces/{workspaceID}/usage/options:
