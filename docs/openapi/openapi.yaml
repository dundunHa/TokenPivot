                quality: known
            status: success
    DeadlineExhaustedResponse:
      summary: 处理期限耗尽（3 项已定、3 项重试）
      description: |
        8 秒预算到达时仍能写响应：前 3 项已得出确定性结论，给真实状态；后 3 项未开始或结论不确定，全部 `retryable/DEADLINE_EXCEEDED`，不写 `accepted` 凑数。客户端随后用原批次、原身份、原内容重传，已提交项会被解析为 `duplicate`。

        与同名请求示例 `DeadlineExhaustedRequest` 逐下标对应：第 0 项 `accepted`，第 1 项与第 0 项同身份同内容故 `duplicate`，第 2 项因 known 子集大于 known 父项被永久拒绝，第 3–5 项在预算耗尽时尚未开始。**项数与下标必须与真实请求等长**，这里的 6 项即请求示例的 6 项。
      value:
        request_id: 3d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
        results:
          - index: 0
            status: accepted
          - index: 1
            status: duplicate
          - index: 2
            status: rejected
            error:
              code: USAGE_UNSUPPORTED
              message: known cache_read_tokens exceeds known input_tokens
          - index: 3
            status: retryable
            error:
              code: DEADLINE_EXCEEDED
              message: processing budget exhausted before this item started
          - index: 4
            status: retryable
            error:
              code: DEADLINE_EXCEEDED
              message: processing budget exhausted before this item started
          - index: 5
            status: retryable
            error:
              code: DEADLINE_EXCEEDED
              message: processing budget exhausted before this item started
