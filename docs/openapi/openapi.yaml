openapi: 3.1.0
info:
  title: TokenPivot 用量采集、浏览器认证与凭证管理接口
  version: 'v1'
  summary: 同步批量采集端点、浏览器账号会话接口与 owner 凭证管理接口的唯一格式依据（外部格式主版本 v1）
  description: |
    # 1. 范围与文档边界

    本文冻结 TokenPivot 首版三组接口的格式：**同步批量采集**（方法、路径、外部格式主版本、请求与逐项响应、字段与校验、缺失/零值/估算语义、规范化与摘要、时间窗口与采样点、批量限额）、**浏览器账号会话**（注册、登录、当前会话、登出，以及可信 Origin、会话 Cookie 与错误码）与 **owner 凭证管理**（列表、签发、轮换、撤销，以及会话、`Origin`、owner 准入与错误码）。

    - 采集只有 `/api/v1/ingestion/events` 一个端点，浏览器认证只有 `/api/v1/auth/*` 四个端点，凭证管理只有 `/api/v1/workspaces/*` 下的四个 owner 端点。聚合查询接口（`usage/aggregate`、`usage/rankings`，T-055）与总览只读接口（`workspaces/current`、`usage/options`，T-057）与请求明细/60 秒速率接口（`usage/events`、`usage/rate`，T-058）见 `usage` 标签，其响应中的聚合整数一律是十进制字符串；单事件采集的 JSON integer 格式不变。工作空间与成员管理属 T-019/T-054，不在本文。
    - 本文是格式依据，不是实现说明：不描述 handler 结构、SQL、聚合算法与清理任务。
    - 本文不核实任何采集来源（插件所对接的平台）能否提供某个字段。来源没有能力时按缺失上报，不得伪造值，也不得由服务端补造。
    - 本文所有限额都是首版安全上限，**未经压测**，不构成吞吐承诺。
    - 三组接口的认证互不替代：采集只认 `Authorization: Bearer` 且**不回退 Cookie**；浏览器认证与凭证管理只认会话 Cookie，凭证管理的写操作还要求 `Origin`，插件令牌 `tpk_` 不能用于凭证管理。同一请求同时携带多种凭据时，各自按所属端点规则判定。

    # 2. 外部格式版本与规范化版本

    这是两个不同的东西，不要混用：

    - **外部格式主版本**写在 URI 里：`/api/v1/...`。请求体**不放** `format_version`，避免同一个版本出现两个值。不兼容的字段删除、类型或含义变化、必填项增加、规范化语义变化、新增逐项状态，都必须升级主版本；旧主版本只要仍有合法重传就不得直接退役。
    - **`normalization_version`** 是服务端生成并持久化的比较算法版本，由服务端决定，客户端**不提交**。首版固定为 `"tokenpivot-usage-event/v1"`，与 URI 的 `v1` 相关但不是同一个字段。客户端不需要也不能携带它。

    客户端必须忽略响应中新增的字段；服务端拒绝未知请求字段（详见第 3 节与各 schema）。

    # 3. 意外字段与解析失败的分层

    | 位置 | 首版行为 | 影响范围 |
    |---|---|---|
    | 请求载荷中的重复 JSON 键（任何层级） | 整批拒绝，不写入 | 整批 |
    | JSON 无法无歧义解析（语法错误、非法 UTF-8、尾随内容） | 整批拒绝，不写入 | 整批 |
    | 外壳（顶层对象）未知字段 | 整批拒绝，不写入 | 整批 |
    | 事件对象内未知字段 | 该项永久拒绝 `INVALID_ARGUMENT`，同批其他项照常处理 | 单项 |
    | 用量对象内未知字段 | 同上（该项永久拒绝） | 单项 |

    重复键不能依赖所用 JSON 库“最后一个值覆盖”的偶然行为。**注意**：`additionalProperties: false` 写在 schema 里表达的是“这样的对象是不合法的”，但判定粒度不同——顶层未知字段整批失败，事件内未知字段只让该项失败。因此实现不能只做一次整体 schema 校验，必须按该项粒度归类（见第 11 节的检查分工）。

    # 4. 认证与身份

    ## 4.1 采集端点（Bearer）

    - 只接受 `Authorization: Bearer <token>`。令牌由 T-010 签发，形如 `tpk_` + 随机串（随机部分长度由签发方决定，本文不解析其长度）。
    - 认证成功即确定固定的 `workspace_id` 与 `source_id`。**身份只从认证取得**：`workspace_id`、`source_id`、凭证 ID 一律不得出现在请求载荷中，出现即按未知字段拒绝（顶层整批 `400`，事件内该项 `INVALID_ARGUMENT`），不会因为“值对得上”而放行。
    - `received_at` 由服务端在首次接受事务内采样，客户端不得提交；出现即按未知字段拒绝。
    - 插件端点**不回退 Cookie**：即使同时携带有效浏览器 Cookie，也不会把请求改成浏览器用户身份；没有 Bearer、Bearer 无效或已撤销一律 `401 UNAUTHENTICATED`。
    - 已认证但没有采集权限返回 `403 PERMISSION_DENIED`，不自动重试。
    - 凭证的签发、轮换、撤销路径见 `credentials` 标签下的四个端点；轮换不改变 source，因此轮换后用新凭证重传同一请求仍按原身份判定。

    ## 4.2 浏览器端点（会话 Cookie）

    - 只认 `cookieAuth`（`tokenpivot_session`）。明文为 `tps_` + `crypto/rand.Text()`，数据库只存完整令牌的 SHA-256 原始 32 字节摘要；`tpk_` 插件令牌在这里不被接受，Bearer 头也不建立浏览器身份。
    - 会话 30 天精确滑动：每次有效认证都用一条 `UPDATE ... FROM ... RETURNING` 续期并返回到期时间，无刷新阈值、无绝对截止；数据库返回 0 行即 `401 UNAUTHENTICATED`。四个端点的所有响应都带 `Cache-Control: no-store`。
    - 写请求（注册、登录、登出）必须携带恰好一个 `Origin`，与部署配置的可信 Web origin 在 scheme、host、port 上完全相等；缺失、`null`、多值或不等一律 `403 PERMISSION_DENIED` 且不写库。不从 `Host`、`Forwarded`、`X-Forwarded-Host` 建立信任。`GET /api/v1/auth/session` 是读请求，不要求 `Origin`。
    - 服务端身份只从 Cookie 取得；handler 不读取请求体或路径中的用户 ID。owner 与工作空间成员判断属 T-019，本文不定义；注册时会为每个新用户创建展示名固定为 `Personal` 的个人空间并写入其 `owner` 成员关系，但响应不返回工作空间字段，也没有工作空间 HTTP 接口。
    - 注册与登录限流为单进程内存固定窗口（每规范化邮箱 10 分钟 5 次、每远端 IP 10 分钟 20 次），所有合法尝试都占额度、成功不返还；达到上限的请求不执行密码哈希或写库。
    - 注册开关由部署环境变量 `TOKENPIVOT_REGISTRATION_OPEN` 决定，启动时读取一次，未设置等同 `false`，只接受精确的 `true`/`false`。关闭时仅空库的首个用户可注册，其余一律 `403 REGISTRATION_CLOSED`；空库判定与首个用户写入在同一 `READ COMMITTED` 事务内，并在事务级排他 advisory lock 之后进行。没有查询注册状态的端点。

    # 5. 时间精度、180 天窗口与采样点

    ## 5.1 精度与表示

    - `occurred_at` 必须带偏移（offset），是最多 6 位小数秒的 RFC 3339 时间字符串。RFC 3339 允许小写 `t`/`z`，本文一视同仁接受，但规范化输出统一写成大写 `T` 与 `Z`。
    - 解析后统一折算为 **UTC 微秒**（秒后固定 6 位小数）。微秒是格式与存储的共同精度。
    - 超过 6 位小数秒一律拒绝（`INVALID_ARGUMENT`），**不舍入、不截断**。闰秒（秒值 `60`）拒绝。没有偏移的本地时间拒绝。日历上不存在的日期（如 2 月 30 日）与超出范围的偏移拒绝。

    ## 5.2 有效窗口

    服务端时间记作 `T`（取数据库实际当前时间，不取事务开始时间常量）。有效窗口是

    ```
    [T - 180 × 24h, T]
    ```

    两端**包含**。时钟偏差**为 0 秒**：不接受任何**晚于** `T` 的时间，也不把未来时间截成 `T`，不用 `received_at` 替换 `occurred_at`。

    | 位置 | 结论 |
    |---|---|
    | `occurred_at < T - 180×24h` | 该项 `expired`（永久拒绝，且**先于**任何查重判断） |
    | `occurred_at` 恰好等于下界 | 有效 |
    | `occurred_at` 恰好等于 `T` | 有效 |
    | `occurred_at > T` | 该项 `rejected` + `FUTURE_EVENT`（不是 `expired`） |

    `expired` 与 `rejected/FUTURE_EVENT` 都是永久项结果：不承诺 `duplicate`/`conflict`，即使原记录仍在也不返回它们。下界之前不保存身份摘要，因此客户端不得靠改时间或复用 ID 绕过窗口。

    ## 5.3 采样点

    不得用批次起点的一次采样覆盖整个长批次。要求：

    1. 每项**首次判断前**采样一次 `T`。
    2. 在 INSERT 返回后、冲突 SELECT 返回后（含锁等待结束）、分钟增量写入及锁等待结束后、以及 Commit 之前，**重新采样并复核**窗口。
    3. 复核发现已过期，则按该项当前阶段处理：尚未写入的回滚本项并返回 `expired`；已写入明细与分钟增量的连同事务一起回滚并返回 `expired`。不得因为“开始时有效”就继续提交。
    4. 复核仍有效才提交并返回 `accepted`。

    ## 5.4 `received_at` 语义

    `received_at` 是首次接受事务中**显式采样**的服务端接收时间，不是精确的 Commit 墙钟时间；重传不更新它，也不延长 180 天明细保留。时钟偏差为 0 时继续满足 `occurred_at <= received_at`。

    ## 5.5 时间边界样例（七组）

    固定样例 `T = 2026-10-27T14:00:00Z`，则下界为 `T - 180×24h = 2026-04-30T14:00:00.000000Z`。

    | # | 场景 | `occurred_at` 输入 | 规范化后的 UTC 微秒 | 结论 |
    |---|---|---|---|---|
    | 1 | 下界恰好（用 -07:00 偏移书写等价时刻） | `2026-04-30T07:00:00-07:00` | `2026-04-30T14:00:00.000000Z` | 有效 |
    | 2 | 下界前 1 微秒 | `2026-04-30T13:59:59.999999Z` | `2026-04-30T13:59:59.999999Z` | `expired` |
    | 3 | `T` 恰好 | `2026-10-27T14:00:00Z` | `2026-10-27T14:00:00.000000Z` | 有效 |
    | 4 | `T` 后 1 微秒 | `2026-10-27T14:00:00.000001Z` | `2026-10-27T14:00:00.000001Z` | `rejected` / `FUTURE_EVENT` |
    | 5 | 不同偏移等价 | `2026-10-27T14:00:00Z` 与 `2026-10-27T07:00:00-07:00` | 两者同为 `2026-10-27T14:00:00.000000Z` | 有效，摘要相同 |
    | 6 | 超精度 | `2026-10-27T14:00:00.1234567Z` | 不产生 | `rejected` / `INVALID_ARGUMENT` |
    | 7 | 等待后跨过下界 | 批次起点 `T0 = 2026-10-27T14:00:00Z` 时提交 `2026-04-30T14:00:00.000000Z` | `2026-04-30T14:00:00.000000Z` | 起点判断有效；锁等待后复核时刻 `T1 = 2026-10-27T14:00:00.000001Z`，下界变为 `2026-04-30T14:00:00.000001Z`，该项已过期 → 回滚本项，返回 `expired`，不得提交 |

    第 5 组同时是第 6 节向量 A 的时间依据。第 6 组的七位小数在 `pattern` 层就被拒绝（见 `occurred_at` schema）。

    # 6. 规范化、摘要与跨版本比较

    ## 6.1 规范化版本与摘要形式

    - 首版 `normalization_version = "tokenpivot-usage-event/v1"`。
    - 摘要 = SHA-256 的**原始 32 字节**（`bytea`），不是十六进制文本，避免大小写等表示歧义。下文向量里的十六进制只供人眼比对，落库比较的是 32 字节。
    - 首版只实现这一套算法，不建算法注册系统，不预建双哈希，不保存原始报文。
    - 规范化和落库必须使用**同一份类型化结果**：先解析成类型化事件，再由它同时生成摘要与各列，禁止两处各自序列化。

    ## 6.2 比较集合（固定顺序的规范化 JSON 数组）

    规范化内容是一个 UTF-8 JSON **数组**，元素个数与顺序固定为 7 个：

    | 位置 | 内容 | 说明 |
    |---|---|---|
    | 0 | `occurred_at` | JSON 字符串，`YYYY-MM-DDTHH:MM:SS.ffffffZ`，固定 6 位小数秒，始终以 `Z` 结尾（即已折算为 UTC） |
    | 1 | `project_id` | JSON 字符串（**小写** UUID）或 `null` |
    | 2 | `provider` | JSON 字符串，原样字节 |
    | 3 | `model` | JSON 字符串，原样字节 |
    | 4 | `usage` | JSON 对象，6 个指标**全部出现**，键顺序固定见 6.3 |
    | 5 | `status` | JSON 字符串（原样字节，不做大小写或空白归一化）或 `null` |
    | 6 | `duration_ms` | JSON 整数（十进制形式）或 `null` |

    这是对比较集合五组字段的直接展开：第 0 组=occurred_at，第 1 组=project_id，第 2、3 个元素=provider 与 model，第 4 个元素=六个指标，第 5、6 个元素=status 与 duration_ms。

    排除项（不参与比较，重传改变它们不算内容修正）：workspace/source 的认证表示、内部事件 UUID、`source_event_id` 身份本身、`received_at`、凭证、请求下标、JSON 字段顺序、对象空白。身份已由三字段唯一键确定。

    ## 6.3 序列化规则（逐字符可复现）

    1. 字符串为 UTF-8，无 BOM，**无首尾空白，无行尾换行**，任何位置都不出现无意义空白（`:` 与 `,` 后不加空格）。
    2. 字符串转义遵循 RFC 8259 最小转义：`"` → `\"`，`\` → `\\`，U+0000–U+001F 控制字符用 `\b`、`\f`、`\n`、`\r`、`\t` 或 `\u00XX`（十六进制小写）；**不**转义 `/`；**不**把非 ASCII 字符转成 `\uXXXX`，直接写其 UTF-8 字节；不输出代理对转义。因为各字符串字段的入口校验已拒绝控制字符，实际可能出现转义的只剩 `"` 与 `\`。
    3. 数字只写十进制整数：无前导零（`0` 本身除外）、无 `+`、无小数点、无指数、无 `-0`。
    4. 缺失写 `null` 字面量，不省略。`usage` 对象中**六个指标全部出现**，客户端省略的指标在规范化时显式补成 `{"value":null,"quality":"missing"}`。注意：省略与 `{"value":null,"quality":"missing"}` 在**入口**等价，但 `total_tokens` 的这两种表示都是「total 未提供」，会触发第 6.6 节第 2 条的推导（例如输入 100 known、输出 20 known、total 写 missing 或省略，结果同为 `total=120 known`），**不是**保留为 missing。
    5. `usage` 内的键顺序固定为 `input_tokens`、`output_tokens`、`total_tokens`、`cache_read_tokens`、`cache_write_tokens`、`reasoning_tokens`；每个指标对象内的键顺序固定为 `value`、`quality`。
    6. 摘要 = 对整个规范化文本的 UTF-8 字节做 SHA-256，取 32 字节原始输出。

    ## 6.4 测试向量（五组，均为实算）

    下面的文本可直接逐字符复制后用 `printf '%s' '<文本>' | shasum -a 256` 复现。这些向量只含 ASCII 可打印字符，因此不涉及“非 ASCII 是否转义”的差异；复现时**不要**带上行尾换行。

    ### 向量 A：偏移等价（不同偏移、同一摘要）

    请求 a1 的 `occurred_at` 写作 `2026-10-27T14:00:00Z`，请求 a2 写作 `2026-10-27T07:00:00-07:00`，其余内容相同，两者规范化文本相同：

    ```
    ["2026-10-27T14:00:00.000000Z",null,"example-provider","example-model",{"input_tokens":{"value":100,"quality":"known"},"output_tokens":{"value":20,"quality":"known"},"total_tokens":{"value":120,"quality":"known"},"cache_read_tokens":{"value":null,"quality":"missing"},"cache_write_tokens":{"value":null,"quality":"missing"},"reasoning_tokens":{"value":null,"quality":"missing"}},"success",1250]
    ```

    SHA-256：`66311d0f0854f50184e40db98ea8bc0f086c470b1dd0817eb512fdb17cbdc121`

    该事件省略了 `total_tokens`，输入 100 与输出 20 均 known，故补出 `{"value":120,"quality":"known"}`；省略的三个指标补成 missing（规则见第 6.6 节）。

    ### 向量 B：字段顺序等价与 UUID 大小写等价

    同一个事件的两种 JSON 写法（键顺序不同、`project_id` 大小写不同、`duration_ms` 一次显式写 `null` 一次省略）：

    ```
    {"events":[{"source_event_id":"req-b1","duration_ms":null,"status":"success","usage":{"reasoning_tokens":{"quality":"known","value":50},"cache_read_tokens":{"value":400,"quality":"known"},"output_tokens":{"value":250,"quality":"estimated"},"input_tokens":{"value":1000,"quality":"known"}},"occurred_at":"2026-10-26T23:30:00.123456Z","model":"example-model","provider":"example-provider","project_id":"0199A0B0-0000-7000-8000-00000000000A"}]}
    ```

    ```
    {"events":[{"source_event_id":"req-b1","project_id":"0199a0b0-0000-7000-8000-00000000000a","provider":"example-provider","model":"example-model","occurred_at":"2026-10-26T23:30:00.123456Z","usage":{"input_tokens":{"value":1000,"quality":"known"},"output_tokens":{"value":250,"quality":"estimated"},"cache_read_tokens":{"value":400,"quality":"known"},"reasoning_tokens":{"value":50,"quality":"known"}},"status":"success"}]}
    ```

    两者规范化文本相同（`total_tokens` 由 1000 known 与 250 estimated 补为 1250 estimated）：

    ```
    ["2026-10-26T23:30:00.123456Z","0199a0b0-0000-7000-8000-00000000000a","example-provider","example-model",{"input_tokens":{"value":1000,"quality":"known"},"output_tokens":{"value":250,"quality":"estimated"},"total_tokens":{"value":1250,"quality":"estimated"},"cache_read_tokens":{"value":400,"quality":"known"},"cache_write_tokens":{"value":null,"quality":"missing"},"reasoning_tokens":{"value":50,"quality":"known"}},"success",null]
    ```

    SHA-256：`538702154d0bc75b274ecb4e70bfc7ec6241a2029d9c07dff6b68e0242ba3e3e`

    ### 向量 C：真实零与缺失不同（C1 与 C2）

    C1 是输入 token 的**真实零**（`{"value":0,"quality":"known"}`），C2 是同一字段**缺失**（省略），两者摘要必须不同：

    ```
    ["2026-10-27T00:00:00.000000Z",null,"example-provider","example-model",{"input_tokens":{"value":0,"quality":"known"},"output_tokens":{"value":null,"quality":"missing"},"total_tokens":{"value":null,"quality":"missing"},"cache_read_tokens":{"value":null,"quality":"missing"},"cache_write_tokens":{"value":null,"quality":"missing"},"reasoning_tokens":{"value":null,"quality":"missing"}},null,0]
    ```

    C1 SHA-256：`fc31a256fba11fc95019164f220e4b47f6673d924c1135c0a57b3117ac841c89`

    ```
