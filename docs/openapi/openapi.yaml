          description: '修改后的完整项目对象。'
          headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ManagementInvalidArgument'
        '401':
          $ref: '#/components/responses/ManagementUnauthenticated'
        '403':
          $ref: '#/components/responses/ManagementPermissionDenied'
        '404':
          $ref: '#/components/responses/ManagementNotFound'
        '413':
          $ref: '#/components/responses/ManagementBodyTooLarge'
        '415':
          $ref: '#/components/responses/ManagementUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ManagementInternal'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
    delete:
