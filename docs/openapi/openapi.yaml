            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/ManagementInvalidArgument'
        '401':
          $ref: '#/components/responses/ManagementUnauthenticated'
        '403':
          $ref: '#/components/responses/ManagementPermissionDenied'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '413':
          $ref: '#/components/responses/ManagementBodyTooLarge'
        '415':
          $ref: '#/components/responses/ManagementUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ManagementInternal'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /api/v1/workspaces/{workspaceID}/sources/{sourceID}:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/SourceID'
    patch:
      tags:
        - sources
      operationId: updateSource
      summary: 修改来源机器标识
      description: |
        准入顺序固定为 **`Origin` → 会话 → 空间角色（先解析 `workspaceID`）→ 资源 ID → 请求体 → 数据库**：`Origin` 缺失、`null`、多值或不等时在会话检查之前返回 `403`；仅 owner 可写，member 与非成员一律 `403`。

        请求体上限 16 KiB（超出 `413 BODY_TOO_LARGE`），`Content-Type` 必须为 `application/json`（否则 `415`）。严格解码：拒绝非 UTF-8、未知字段、重复键、尾随 JSON、`null` 字段与错误类型；文本字段为 1–128 UTF-8 字节、不含控制字符、不含首尾 Unicode 空白，且不做 trim 或大小写归一化。

        只允许 `platform` 与 `instance_key`，至少提供一个，未提供的保持不变；二者只是机器标识，`source_id`、workspace、事件归属、凭证绑定与令牌均不变（插件继续使用原令牌）。重复提交相同值是幂等的；与同空间其他来源冲突返回 `409 CONFLICT`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdateRequest'
      responses:
        '200':
          description: '修改后的完整来源对象。'
          headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/ManagementInvalidArgument'
        '401':
          $ref: '#/components/responses/ManagementUnauthenticated'
        '403':
          $ref: '#/components/responses/ManagementPermissionDenied'
        '404':
          $ref: '#/components/responses/ManagementNotFound'
        '409':
          $ref: '#/components/responses/ManagementConflict'
        '413':
          $ref: '#/components/responses/ManagementBodyTooLarge'
        '415':
          $ref: '#/components/responses/ManagementUnsupportedMediaType'
        '500':
          $ref: '#/components/responses/ManagementInternal'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
    delete:
      tags:
        - sources
      operationId: archiveSource
      summary: 归档来源并撤销其有效凭证
      description: |
        准入顺序固定为 **`Origin` → 会话 → 空间角色（先解析 `workspaceID`）→ 资源 ID → 请求体 → 数据库**：`Origin` 缺失、`null`、多值或不等时在会话检查之前返回 `403`；仅 owner 可写，member 与非成员一律 `403`。

        **DELETE 是归档，不是物理删除**：保留行、事件（`usage_events`）、分钟聚合（`usage_minute_stats`）与凭证记录，不重新归属；无恢复接口；归档行仍占用唯一键，因此删除后用相同键再次创建仍返回 `409 CONFLICT`。请求体必须为空，重复 DELETE 返回 `204` 且保留第一次 `archived_at`。

        同一事务内先锁定来源行、写 `archived_at`，再把该来源下 `revoked_at IS NULL` 的凭证撤销（已撤销行不变，令牌摘要与 `source_id` 不变）；与凭证签发/轮换使用同一把来源行锁，因此归档提交之后不会再有有效凭证，已归档来源的签发/轮换返回 `409 CONFLICT`。

        归档响应只保证**新的**采集认证失败（`401`）；归档前已完成认证的采集请求允许完成并写入历史，之后仍可能更新该来源的 `last_received_at`，但不会重新激活来源或凭证。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '204':
          description: '已归档（或此前已归档），无响应体。'
          headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ManagementInvalidArgument'
        '401':
          $ref: '#/components/responses/ManagementUnauthenticated'
        '403':
          $ref: '#/components/responses/ManagementPermissionDenied'
        '404':
          $ref: '#/components/responses/ManagementNotFound'
        '500':
          $ref: '#/components/responses/ManagementInternal'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
  /api/v1/workspaces/{workspaceID}/sources/{sourceID}/credentials:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/SourceID'
    get:
      tags:
        - credentials
      operationId: listSourceCredentials
      summary: 列出该 workspace 与 source 下的凭证元数据
      description: |
        owner 管理的凭证列表，返回路径 `workspaceID` 与 `sourceID` 下的**全部**凭证元数据，包括已撤销的，用 `revoked_at` 表达撤销状态。

        这是读请求：只要求有效浏览器会话和 workspace owner，**不要求 `Origin`**；缺失或错误的 `Origin` 不影响结果。列表不创建、不修改任何凭证，不使用缓存，也不返回 `token`、`secret_hash` 或任何摘要派生值——明文只在签发/轮换响应中出现一次，此处不可恢复。

        `sourceID` 不属于路径 `workspaceID` 时返回 `404 NOT_FOUND`，不返回跨空间元数据，因此 `200` 且空数组只表示该 source 存在但还没有凭证。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: '该 source 下的凭证元数据，已撤销项也包含在内；按创建顺序排列。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialList'
              example:
                credentials:
                  - credential_id: 018f3c5e-1a2b-7c3d-8e9f-0a1b2c3d4e5f
                    workspace_id: 018f3c5e-0a1b-7c3d-8e9f-0a1b2c3d4e5f
                    source_id: 018f3c5e-2b3c-7d4e-9f0a-1b2c3d4e5f60
                    revoked_at: null
        '400':
          description: '`INVALID_ARGUMENT`：`workspaceID` 或 `sourceID` 不是合法 UUID。不读取、不创建也不修改凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: INVALID_ARGUMENT
                  message: path parameter must be a UUID
        '401':
          description: '`UNAUTHENTICATED`：无 Cookie，或会话格式错误、不存在、已过期、已撤销。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：会话有效但不是该 workspace 的 owner（含非成员）。不返回任何元数据。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: workspace owner required
        '404':
          description: '`NOT_FOUND`：source 不存在或不属于路径 workspace。不返回跨空间元数据。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: NOT_FOUND
                  message: credential resource not found
        '500':
          $ref: '#/components/responses/AuthInternal'
        '503':
          $ref: '#/components/responses/CredentialUnavailable'
    post:
      tags:
        - credentials
      operationId: issueSourceCredential
      summary: 为该 source 签发新凭证
      description: |
        owner 为路径 `sourceID` 签发一个绑定该 workspace 与 source 的新凭证，`201` 返回凭证 ID、固定归属和**一次性明文令牌** `token`（`tpk_` + 随机串）。数据库只保存完整令牌的 SHA-256 摘要，不保存明文；响应之后无法再取回该明文。

        请求体必须为空：`workspace_id`、`source_id`、`role`、凭证 TTL 等字段都不被接受，出现任何内容即 `400 INVALID_ARGUMENT` 且不创建凭证。归属只取自路径与数据库行，客户端不能指定。

        写操作必须携带与可信 Web origin 完全一致的 `Origin`。准入顺序固定为 **`Origin` → 会话 → owner（含 `workspaceID` 解析）→ 请求体为空 → `sourceID` 解析 → 数据库**：`Origin` 缺失或不等时在会话检查之前就返回 `403`，因此同时缺 Cookie 又缺 `Origin` 的请求得到 `403` 而非 `401`；归属校验全部通过后才创建凭证，任一失败都不创建。签发**不是幂等操作**：响应丢失后重试可能留下多个有效凭证，此时用列表取得多余凭证的 ID 再撤销。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      responses:
        '201':
          description: '凭证已创建；`token` 只在此响应中出现一次。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedCredential'
              example:
                credential_id: 018f3c5e-1a2b-7c3d-8e9f-0a1b2c3d4e5f
                workspace_id: 018f3c5e-0a1b-7c3d-8e9f-0a1b2c3d4e5f
                source_id: 018f3c5e-2b3c-7d4e-9f0a-1b2c3d4e5f60
                token: tpk_SYNTHETICONLYNOTAREALTOKEN
        '400':
          description: '`INVALID_ARGUMENT`：请求体非空，或路径参数不是合法 UUID。不创建也不修改凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              examples:
                body:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: request body must be empty
                path:
                  value:
                    error:
                      code: INVALID_ARGUMENT
                      message: path parameter must be a UUID
        '401':
          description: '`UNAUTHENTICATED`：无 Cookie，或会话不可用。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: UNAUTHENTICATED
                  message: authentication required
        '403':
          description: '`PERMISSION_DENIED`：`Origin` 缺失、为 `null`、多值或不等于可信 origin，或会话用户不是该 workspace 的 owner。不创建也不修改凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: PERMISSION_DENIED
                  message: request origin is not allowed
        '404':
          description: '`NOT_FOUND`：source 不存在或不属于路径 workspace。不创建凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: NOT_FOUND
                  message: credential resource not found
        '409':
          description: '`CONFLICT`：来源已归档（`source is archived`）。来源行锁与归档串行，归档提交后不会再产生有效凭证；列表与撤销在已归档来源上仍可用。不创建凭证。'
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialError'
              example:
                error:
                  code: CONFLICT
                  message: source is archived
        '500':
          $ref: '#/components/responses/AuthInternal'
        '503':
          $ref: '#/components/responses/CredentialUnavailable'
  /api/v1/workspaces/{workspaceID}/credentials/{credentialID}/rotate:
    parameters:
      - $ref: '#/components/parameters/WorkspaceID'
      - $ref: '#/components/parameters/CredentialID'
    post:
      tags:
