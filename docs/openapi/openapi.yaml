      description: |
        准入顺序固定为 **`Origin` → 会话 → 空间角色（先解析 `workspaceID`）→ 资源 ID → 请求体 → 数据库**：`Origin` 缺失、`null`、多值或不等时在会话检查之前返回 `403`；仅 owner 可写，member 与非成员一律 `403`。

        请求体上限 16 KiB（超出 `413 BODY_TOO_LARGE`），`Content-Type` 必须为 `application/json`（否则 `415`）。严格解码：拒绝非 UTF-8、未知字段、重复键、尾随 JSON、`null` 字段与错误类型；文本字段为 1–128 UTF-8 字节、不含控制字符、不含首尾 Unicode 空白，且不做 trim 或大小写归一化。

        只允许 `{"name"}`；`project_key` 本期不可修改。重复提交相同值是幂等的，仍返回 `200` 和当前对象。项目属于另一空间时与不存在一样返回 `404 NOT_FOUND`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
