      summary: 列出 workspace 下的数据来源（含已归档）
      description: |
        读请求：要求有效浏览器会话，owner 与 member 均可读，非成员 `403`；**不要求 `Origin`**。成员角色数据库故障返回 `500 INTERNAL`，绝不当作非成员；会话存储故障返回 `503 UNAVAILABLE`。

        按 `created_at, id` 升序返回，空列表为 `[]`，已归档来源也包含在内并带 `archived_at`。
      security:
        - cookieAuth: []
      responses:
        '200':
          description: '来源列表。'
          headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'
        '400':
          $ref: '#/components/responses/ManagementInvalidArgument'
        '401':
          $ref: '#/components/responses/ManagementUnauthenticated'
        '403':
          $ref: '#/components/responses/ManagementPermissionDenied'
        '500':
          $ref: '#/components/responses/ManagementInternal'
        '503':
          $ref: '#/components/responses/ManagementUnavailable'
    post:
      tags:
        - sources
      operationId: createSource
      summary: 创建数据来源
      description: |
        准入顺序固定为 **`Origin` → 会话 → 空间角色（先解析 `workspaceID`）→ 资源 ID → 请求体 → 数据库**：`Origin` 缺失、`null`、多值或不等时在会话检查之前返回 `403`；仅 owner 可写，member 与非成员一律 `403`。

        请求体上限 16 KiB（超出 `413 BODY_TOO_LARGE`），`Content-Type` 必须为 `application/json`（否则 `415`）。严格解码：拒绝非 UTF-8、未知字段、重复键、尾随 JSON、`null` 字段与错误类型；文本字段为 1–128 UTF-8 字节、不含控制字符、不含首尾 Unicode 空白，且不做 trim 或大小写归一化。

        请求 `{"platform","instance_key"}` 两者必填；不新增 DSH/PI 白名单。创建来源**不会**自动创建凭证，owner 随后调用凭证签发接口。创建不是幂等操作：重复的 `(platform, instance_key)` 返回 `409 CONFLICT`。
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceCreateRequest'
      responses:
        '201':
          description: '来源已创建，返回完整对象。'
          headers:
              Cache-Control:
                $ref: '#/components/headers/NoStore'
